<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة منصات بأسلوب ماريو</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #5c94fc; /* لون سماء اللعبة */
            overflow: hidden;
            touch-action: none; /* لمنع تكبير الشاشة عند اللمس */
            font-family: 'Courier New', Courier, monospace;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background-color: #5c94fc;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
            max-width: 100%;
            max-height: 100%;
        }

        /* تصميم لوحة النتيجة */
        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
        }

        /* تنسيق أزرار الجوال */
        #ui-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 10;
        }

        .dir-buttons, .action-buttons {
            pointer-events: auto;
            display: flex;
            gap: 20px;
        }

        .control-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.8);
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:active {
            background-color: rgba(255, 255, 255, 0.8);
            color: #000;
            transform: scale(0.95);
        }

        /* إخفاء أزرار اللمس على شاشات الكمبيوتر */
        @media (min-width: 768px) {
            #ui-controls { display: none; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- لوحة النتيجة -->
    <div id="score-board">النتيجة: <span id="score">0</span></div>
    
    <canvas id="gameCanvas"></canvas>
    
    <!-- أزرار التحكم للجوال -->
    <div id="ui-controls">
        <div class="dir-buttons">
            <button id="btn-left" class="control-btn">◀</button>
            <button id="btn-right" class="control-btn">▶</button>
        </div>
        <div class="action-buttons">
            <button id="btn-jump" class="control-btn">▲</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    const GAME_WIDTH = 800;
    const GAME_HEIGHT = 400;

    function resize() {
        const scale = Math.min(window.innerWidth / GAME_WIDTH, window.innerHeight / GAME_HEIGHT);
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        canvas.style.width = `${GAME_WIDTH * scale}px`;
        canvas.style.height = `${GAME_HEIGHT * scale}px`;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- متغيرات وحالة اللعبة ---
    let score = 0;
    let cameraX = 0;

    const player = {
        x: 50, y: 200, width: 28, height: 28,
        speed: 0, maxSpeed: 5, jumpPower: -11, gravity: 0.6, friction: 0.8,
        dy: 0, dx: 0, grounded: false
    };

    // تعريف خريطة المرحلة
    let platforms = [];
    let enemies = [];
    let coins = [];
    let lava = [];
    let goal = {};

    // دالة لبناء المرحلة
    function initLevel() {
        score = 0;
        scoreElement.innerText = score;
        player.x = 50;
        player.y = 200;
        player.dx = 0;
        player.dy = 0;

        // المنصات والجدران
        platforms = [
            { x: 0, y: 350, w: 400, h: 50, type: 'ground' },
            { x: 200, y: 250, w: 100, h: 20, type: 'block' },
            { x: 450, y: 350, w: 300, h: 50, type: 'ground' },
            { x: 550, y: 200, w: 150, h: 20, type: 'block' }, 
            { x: 650, y: 300, w: 40, h: 50, type: 'pipe' },
            { x: 900, y: 350, w: 150, h: 50, type: 'ground' },
            { x: 1200, y: 350, w: 400, h: 50, type: 'ground' },
            { x: 1250, y: 250, w: 50, h: 20, type: 'block' },
            { x: 1400, y: 150, w: 100, h: 20, type: 'block' }
        ];

        // الأعداء
        enemies = [
            { x: 300, y: 320, w: 26, h: 26, dx: -1, isDead: false },
            { x: 600, y: 170, w: 26, h: 26, dx: 1, isDead: false },
            { x: 950, y: 320, w: 26, h: 26, dx: -1.5, isDead: false },
            { x: 1300, y: 320, w: 26, h: 26, dx: 1, isDead: false }
        ];

        // العملات الذهبية
        coins = [
            { x: 235, y: 210, w: 15, h: 15, collected: false },
            { x: 560, y: 160, w: 15, h: 15, collected: false },
            { x: 600, y: 160, w: 15, h: 15, collected: false },
            { x: 640, y: 160, w: 15, h: 15, collected: false },
            { x: 1265, y: 210, w: 15, h: 15, collected: false }
        ];

        // الحمم البركانية
        lava = [
            { x: 1050, y: 370, w: 150, h: 30 }
        ];

        // خط النهاية
        goal = { x: 1500, y: 200, w: 40, h: 150 };
    }

    // --- نظام التحكم ---
    const keys = { right: false, left: false, up: false };

    window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
    });

    function setupTouchControls() {
        const bindTouch = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        };
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-jump', 'up');
    }
    setupTouchControls();

    // --- الكشف عن الاصطدام ---
    function checkCollision(r1, r2) {
        return r1.x < r2.x + r2.w && r1.x + r1.width > r2.x &&
               r1.y < r2.y + r2.h && r1.y + r1.height > r2.y;
    }

    // --- حلقة اللعبة الأساسية ---
    function update() {
        // 1. حركة اللاعب
        if (keys.up && player.grounded) {
            player.dy = player.jumpPower;
            player.grounded = false;
        }
        
        if (keys.right) player.dx += 1;
        else if (keys.left) player.dx -= 1;
        
        player.dx *= player.friction;
        if (Math.abs(player.dx) > player.maxSpeed) player.dx = player.dx > 0 ? player.maxSpeed : -player.maxSpeed;
        
        player.dy += player.gravity;
        
        // اصطدام أفقي (X)
        player.x += player.dx;
        player.grounded = false;
        for (let p of platforms) {
            if (checkCollision(player, p)) {
                if (player.dx > 0) player.x = p.x - player.width;
                else if (player.dx < 0) player.x = p.x + p.w;
                player.dx = 0;
            }
        }
        
        // اصطدام عمودي (Y)
        player.y += player.dy;
        for (let p of platforms) {
            if (checkCollision(player, p)) {
                if (player.dy > 0) { // السقوط على الأرض
                    player.y = p.y - player.height;
                    player.dy = 0;
                    player.grounded = true;
                } else if (player.dy < 0) { // ضرب الرأس
                    player.y = p.y + p.h;
                    player.dy = 0;
                }
            }
        }
        
        if (player.x < 0) player.x = 0;

        // 2. تحديث الأعداء
        enemies.forEach(enemy => {
            if (enemy.isDead) return;
            
            enemy.x += enemy.dx;
            
            for (let p of platforms) {
                if (checkCollision(enemy, p)) {
                    if (p.type === 'pipe' || p.type === 'block') {
                        enemy.dx *= -1; 
                    }
                }
            }

            if (checkCollision(player, enemy)) {
                if (player.dy > 0 && player.y + player.height - player.dy <= enemy.y + 10) {
                    enemy.isDead = true;
                    player.dy = -8; 
                    score += 100;
                    scoreElement.innerText = score;
                } else {
                    initLevel(); 
                }
            }
        });

        // 3. تحديث العملات
        coins.forEach(coin => {
            if (!coin.collected && checkCollision(player, coin)) {
                coin.collected = true;
                score += 50;
                scoreElement.innerText = score;
            }
        });

        // 4. السقوط في الحمم أو الهاوية
        lava.forEach(l => {
            if (checkCollision(player, l)) initLevel();
        });
        
        if (player.y > GAME_HEIGHT) initLevel();

        // 5. الفوز باللعبة
        if (checkCollision(player, goal)) {
            alert(`مبروك! أكملت المرحلة. نتيجتك: ${score}`);
            initLevel();
        }

        // الكاميرا
        cameraX = player.x - GAME_WIDTH / 2.5;
        if (cameraX < 0) cameraX = 0;

        draw();
        requestAnimationFrame(update);
    }

    // --- الرسم ---
    function draw() {
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        
        ctx.save();
        ctx.translate(-cameraX, 0); 
        
        // رسم المنصات
        platforms.forEach(p => {
            if(p.type === 'pipe') ctx.fillStyle = '#00a800'; 
            else if(p.type === 'block') ctx.fillStyle = '#f8b800'; 
            else ctx.fillStyle = '#c84c0c'; 
            
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x, p.y, p.w, p.h);
        });
        
        // رسم الحمم
        lava.forEach(l => {
            ctx.fillStyle = '#ff4000';
            ctx.fillRect(l.x, l.y, l.w, l.h);
        });

        // رسم العملات
        coins.forEach(coin => {
            if (!coin.collected) {
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(coin.x + coin.w/2, coin.y + coin.h/2, coin.w/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
        });

        // رسم خط النهاية
        ctx.fillStyle = '#fff';
        ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
        ctx.fillStyle = '#000';
        ctx.fillText("النهاية", goal.x + 5, goal.y + 20);
        
        // رسم الأعداء
        enemies.forEach(enemy => {
            if (!enemy.isDead) {
                ctx.fillStyle = '#802a2a';
                ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
                ctx.fillStyle = '#fff';
                ctx.fillRect(enemy.x + 4, enemy.y + 6, 6, 6);
                ctx.fillRect(enemy.x + 16, enemy.y + 6, 6, 6);
                ctx.fillStyle = '#000';
                ctx.fillRect(enemy.x + 6, enemy.y + 8, 2, 2);
                ctx.fillRect(enemy.x + 18, enemy.y + 8, 2, 2);
            }
        });

        // رسم اللاعب
        ctx.fillStyle = '#f80000';
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillStyle = '#fff';
        let eyeX = keys.left ? player.x + 4 : player.x + 18;
        ctx.fillRect(eyeX, player.y + 6, 6, 6);
        
        ctx.restore();
    }

    // تشغيل اللعبة
    initLevel();
    update();
</script>
</body>
</html>
