<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super Mindrix</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #5c94fc;
            overflow: hidden;
            touch-action: none; /* يمنع التكبير والتصغير العشوائي */
            font-family: 'Courier New', Courier, monospace;
        }

        /* رسالة تدوير الشاشة تظهر فقط في وضع الطول */
        #rotate-device {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            color: #fff;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 24px;
        }
        #rotate-device span { font-size: 50px; margin-bottom: 20px; }
        
        @media (orientation: landscape) {
            #rotate-device { display: none; }
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background-color: #5c94fc;
            max-width: 100%;
            max-height: 100%;
        }

        .game-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
            text-align: center;
        }

        .game-screen h1 {
            font-size: 40px;
            color: #f8b800;
            text-shadow: 3px 3px #c84c0c;
            margin-bottom: 10px;
        }

        .menu-btn {
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            background-color: #e52521;
            color: white;
            border: 3px solid #fff;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }

        #score-board {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
            display: none;
        }

        /* إصلاح أماكن الأزرار للشاشات العريضة */
        #ui-controls {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* يسمح بلمس ما خلف الأزرار */
            z-index: 15;
            display: none;
        }

        .dir-buttons {
            position: absolute;
            bottom: 30px;
            left: 40px;
            pointer-events: auto;
            display: flex;
            gap: 20px;
        }

        .action-buttons {
            position: absolute;
            bottom: 30px;
            right: 40px;
            pointer-events: auto;
        }

        .control-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.8);
            color: #fff;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:active { background-color: rgba(255, 255, 255, 0.8); color: #000; }
    </style>
</head>
<body>

<!-- شاشة تدوير الجوال -->
<div id="rotate-device">
    <span>🔄</span>
    <p>الرجاء تدوير الجوال بالعرض<br>للاستمتاع باللعبة!</p>
</div>

<div id="game-container">
    <div id="start-screen" class="game-screen">
        <h1>Super Mindrix</h1>
        <button class="menu-btn" onclick="startGame()">ابدأ اللعبة</button>
    </div>

    <div id="gameover-screen" class="game-screen" style="display: none;">
        <h1>خسرت! 😢</h1>
        <p id="final-score" style="font-size: 20px;">النتيجة: 0</p>
        <button class="menu-btn" onclick="startGame()">إعادة المحاولة</button>
    </div>

    <div id="score-board">النتيجة: <span id="score">0</span></div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-controls">
        <div class="dir-buttons">
            <button id="btn-left" class="control-btn">◀</button>
            <button id="btn-right" class="control-btn">▶</button>
        </div>
        <div class="action-buttons">
            <button id="btn-jump" class="control-btn">▲</button>
        </div>
    </div>
</div>

<script>
    // --- نظام الأصوات مع كسر حماية المتصفح ---
    let audioCtx = null;
    let bgmTimer = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        // هذا السطر مهم جداً لعمل الصوت على الجوال
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playJumpSound() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }

    function playCoinSound() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, audioCtx.currentTime); 
        osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.08); 
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start(); osc.stop(audioCtx.currentTime + 0.25);
    }

    function playStompSound() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }

    function playGameOverSound() {
        if (!audioCtx) return;
        let notes = [300, 250, 200, 150];
        notes.forEach((freq, index) => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.12));
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime + (index * 0.12));
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + (index * 0.12) + 0.1);
            osc.start(audioCtx.currentTime + (index * 0.12));
            osc.stop(audioCtx.currentTime + (index * 0.12) + 0.1);
        });
    }

    function startBGM() {
        if (bgmTimer) clearInterval(bgmTimer);
        let melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
        let index = 0;
        bgmTimer = setInterval(() => {
            if (!audioCtx || gameState !== 'PLAYING') return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(melody[index], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            index = (index + 1) % melody.length;
        }, 300);
    }

    function stopBGM() {
        if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
    }

    // --- إعدادات اللعبة ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    
    const GAME_WIDTH = 800;
    const GAME_HEIGHT = 400;

    function resize() {
        const scale = Math.min(window.innerWidth / GAME_WIDTH, window.innerHeight / GAME_HEIGHT);
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        canvas.style.width = `${GAME_WIDTH * scale}px`;
        canvas.style.height = `${GAME_HEIGHT * scale}px`;
    }
    window.addEventListener('resize', resize);
    resize();

    let gameState = 'START';
    let score = 0;
    let cameraX = 0;

    const player = {
        x: 50, y: 200, width: 28, height: 28,
        maxSpeed: 5, jumpPower: -11, gravity: 0.6, friction: 0.8,
        dy: 0, dx: 0, grounded: false
    };

    let platforms = [], enemies = [], coins = [], lava = [], goal = {};

    function initLevel() {
        score = 0;
        scoreElement.innerText = score;
        player.x = 50; player.y = 200; player.dx = 0; player.dy = 0;
        platforms = [
            { x: 0, y: 350, w: 400, h: 50, type: 'ground' },
            { x: 200, y: 250, w: 100, h: 20, type: 'block' },
            { x: 450, y: 350, w: 300, h: 50, type: 'ground' },
            { x: 550, y: 200, w: 150, h: 20, type: 'block' }, 
            { x: 650, y: 300, w: 40, h: 50, type: 'pipe' },
            { x: 900, y: 350, w: 150, h: 50, type: 'ground' },
            { x: 1200, y: 350, w: 400, h: 50, type: 'ground' }
        ];
        enemies = [
            { x: 300, y: 320, w: 26, h: 26, dx: -1, isDead: false },
            { x: 600, y: 170, w: 26, h: 26, dx: 1, isDead: false }
        ];
        coins = [
            { x: 235, y: 210, w: 15, h: 15, collected: false },
            { x: 560, y: 160, w: 15, h: 15, collected: false },
            { x: 600, y: 160, w: 15, h: 15, collected: false }
        ];
        lava = [{ x: 1050, y: 370, w: 150, h: 30 }];
        goal = { x: 1400, y: 200, w: 40, h: 150 };
    }

    function startGame() {
        initAudio(); // تفعيل الصوت مع اللمسة الأولى
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('gameover-screen').style.display = 'none';
        document.getElementById('score-board').style.display = 'block';
        document.getElementById('ui-controls').style.display = 'block'; // إظهار الأزرار
        initLevel();
        gameState = 'PLAYING';
        startBGM();
    }

    function gameOver() {
        stopBGM();
        playGameOverSound();
        gameState = 'GAMEOVER';
        document.getElementById('ui-controls').style.display = 'none';
        document.getElementById('score-board').style.display = 'none';
        document.getElementById('final-score').innerText = `النتيجة النهائية: ${score}`;
        document.getElementById('gameover-screen').style.display = 'flex';
    }

    const keys = { right: false, left: false, up: false };

    function setupTouchControls() {
        const bindTouch = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { 
                e.preventDefault(); 
                initAudio(); // التأكد من تفعيل الصوت
                if (key === 'up' && player.grounded && gameState === 'PLAYING') playJumpSound();
                keys[key] = true; 
            });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        };
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-jump', 'up');
    }
    setupTouchControls();

    function checkCollision(r1, r2) {
        return r1.x < r2.x + r2.w && r1.x + r1.width > r2.x && r1.y < r2.y + r2.h && r1.y + r1.height > r2.y;
    }

    function update() {
        if (gameState === 'PLAYING') {
            if (keys.up && player.grounded) { player.dy = player.jumpPower; player.grounded = false; }
            if (keys.right) player.dx += 1; else if (keys.left) player.dx -= 1;
            
            player.dx *= player.friction;
            if (Math.abs(player.dx) > player.maxSpeed) player.dx = player.dx > 0 ? player.maxSpeed : -player.maxSpeed;
            player.dy += player.gravity;
            
            player.x += player.dx;
            player.grounded = false;
            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.dx > 0) player.x = p.x - player.width; else if (player.dx < 0) player.x = p.x + p.w;
                    player.dx = 0;
                }
            }
            
            player.y += player.dy;
            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.dy > 0) { player.y = p.y - player.height; player.dy = 0; player.grounded = true; } 
                    else if (player.dy < 0) { player.y = p.y + p.h; player.dy = 0; }
                }
            }
            if (player.x < 0) player.x = 0;

            enemies.forEach(enemy => {
                if (enemy.isDead) return;
                enemy.x += enemy.dx;
                for (let p of platforms) if (checkCollision(enemy, p)) { if (p.type === 'pipe' || p.type === 'block') enemy.dx *= -1; }
                if (checkCollision(player, enemy)) {
                    if (player.dy > 0 && player.y + player.height - player.dy <= enemy.y + 10) {
                        enemy.isDead = true; player.dy = -8; playStompSound();
                        score += 100; scoreElement.innerText = score;
                    } else { gameOver(); }
                }
            });

            coins.forEach(coin => {
                if (!coin.collected && checkCollision(player, coin)) {
                    coin.collected = true; playCoinSound();
                    score += 50; scoreElement.innerText = score;
                }
            });

            lava.forEach(l => { if (checkCollision(player, l)) gameOver(); });
            if (player.y > GAME_HEIGHT) gameOver();
            if (checkCollision(player, goal)) { stopBGM(); alert("فزت!"); startGame(); }

            cameraX = player.x - GAME_WIDTH / 2.5;
            if (cameraX < 0) cameraX = 0;
        }
        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        ctx.save(); ctx.translate(-cameraX, 0); 
        
        platforms.forEach(p => {
            ctx.fillStyle = p.type === 'pipe' ? '#00a800' : p.type === 'block' ? '#f8b800' : '#c84c0c'; 
            ctx.fillRect(p.x, p.y, p.w, p.h); ctx.strokeRect(p.x, p.y, p.w, p.h);
        });
        
        lava.forEach(l => { ctx.fillStyle = '#ff4000'; ctx.fillRect(l.x, l.y, l.w, l.h); });

        coins.forEach(coin => {
            if (!coin.collected) {
                ctx.fillStyle = '#ffd700'; ctx.beginPath();
                ctx.arc(coin.x + coin.w/2, coin.y + coin.h/2, coin.w/2, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
            }
        });

        ctx.fillStyle = '#fff'; ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
        ctx.fillStyle = '#000'; ctx.fillText("النهاية", goal.x + 5, goal.y + 20);
        
        enemies.forEach(enemy => {
            if (!enemy.isDead) {
                ctx.fillStyle = '#802a2a'; ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
                ctx.fillStyle = '#fff'; ctx.fillRect(enemy.x + 4, enemy.y + 6, 6, 6); ctx.fillRect(enemy.x + 16, enemy.y + 6, 6, 6);
            }
        });

        ctx.fillStyle = '#f80000'; ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillStyle = '#fff'; ctx.fillRect((keys.left ? player.x + 4 : player.x + 18), player.y + 6, 6, 6);
        ctx.restore();
    }
    update();
</script>
</body>
</html>
