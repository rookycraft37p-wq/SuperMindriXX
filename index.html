<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SuperDrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@700;800&display=swap');
        
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #2b8cbe; font-family: 'Changa', sans-serif; }
        canvas { display: block; background: linear-gradient(#2b8cbe, #74c2e1); }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 20, 30, 0.95);
            z-index: 30; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center;
            overflow-y: auto; padding: 20px;
        }
        #home-screen { display: flex; }
        
        h1.title { font-size: 50px; color: #e52521; text-shadow: 4px 4px #000, -2px -2px #fff; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px; }
        h2.subtitle { font-size: 35px; color: #ffcc00; text-shadow: 2px 2px #000; margin-bottom: 15px; }

        .btn-main { background: #00e676; color: #000; font-size: 22px; font-weight: 800; padding: 10px 30px; margin: 8px; border-radius: 40px; border: 4px solid #fff; cursor: pointer; box-shadow: 0 6px 0px #00793c; transition: all 0.2s; width: 250px; }
        .btn-main:active { transform: translateY(6px); box-shadow: 0 0px 0px #00793c; }
        .btn-shop { background: #ff9800; box-shadow: 0 6px 0px #e65100; }
        .btn-levels { background: #03a9f4; box-shadow: 0 6px 0px #01579b; }
        .btn-back { background: #f44336; box-shadow: 0 6px 0px #b71c1c; margin-top: 20px; }
        .btn-retry { background: #ffcc00; box-shadow: 0 6px 0px #f57f17; }

        .grid-container { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 700px; padding: 10px; }
        .card { background: rgba(255,255,255,0.1); border: 3px solid #fff; border-radius: 15px; padding: 12px; width: 130px; text-align: center; }
        .card.locked { opacity: 0.5; filter: grayscale(100%); pointer-events: none; }
        .card-title { font-size: 16px; margin-bottom: 8px; font-weight: bold; }
        .buy-btn, .level-btn { background: #ffcc00; color: #000; font-weight: 800; border: 2px solid #000; padding: 5px 8px; border-radius: 10px; width: 100%; cursor: pointer; margin-top: 8px; font-size: 14px; }
        .buy-btn:disabled { background: #888; color: #ccc; cursor: not-allowed; }
        .buy-btn.equipped { background: #00e676; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            display: none; flex-direction: column; justify-content: space-between; padding: 10px 15px;
        }
        .top-hud-container { width: 100%; pointer-events: auto; }
        .top-row { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .hud-group { display: flex; gap: 10px; align-items: center; }
        
        .score-box { background: rgba(0, 0, 0, 0.8); color: #ffcc00; padding: 4px 10px; border-radius: 15px; font-size: 18px; font-weight: 800; border: 2px solid #fff; display: flex; align-items: center; }
        .home-icon-btn { font-size: 20px; background: #fff; border: 2px solid #111; border-radius: 50%; width: 38px; height: 38px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 3px 0px #111; }
        .home-icon-btn:active { transform: translateY(3px); box-shadow: 0 0px 0px #111; }

        .level-indicator { background: rgba(0,0,0,0.8); color: #fff; padding: 2px 15px; border-radius: 15px; font-size: 16px; font-weight: bold; border: 2px solid #fff; margin: 4px auto 0; width: fit-content; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }

        .controls-bar {
            position: absolute; bottom: 30px; width: 100%; left: 0; display: flex; justify-content: space-between; padding: 0 30px; z-index: 20; pointer-events: auto; direction: ltr;
        }
        .control-group { display: flex; gap: 15px; }
        .control-btn {
            width: 75px; height: 75px; background: rgba(255, 255, 255, 0.9); border: 4px solid #111; border-radius: 50%; font-size: 30px; font-weight: bold; color: #111; display: flex; justify-content: center; align-items: center; box-shadow: 0 6px 0px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.05s;
        }
        .control-btn:active { transform: translateY(6px); box-shadow: 0 0px 0px rgba(0,0,0,0.5); background: #ddd; }
        #btn-jump { background: #ffcc00; color: #111; }

        #total-coins-display { font-size: 22px; color: #ffcc00; font-weight: bold; margin-bottom: 15px; background: #000; padding: 8px 20px; border-radius: 20px; border: 2px solid #fff;}
    </style>
</head>
<body>

    <div id="home-screen" class="screen">
        <h1 class="title">SUPERDRIX</h1>
        <div id="total-coins-display">🪙 <span id="home-coins">0</span></div>
        <button class="btn-main" onclick="openLevelsScreen()">▶ العب الآن</button>
        <button class="btn-main btn-shop" onclick="openShop()">🛒 المتجر والشخصيات</button>
    </div>

    <div id="levels-screen" class="screen">
        <h2 class="subtitle">المراحل</h2>
        <div class="grid-container" id="levels-grid"></div>
        <button class="btn-main btn-back" onclick="goHome()">العودة للبيت 🏠</button>
    </div>

    <div id="shop-screen" class="screen">
        <h2 class="subtitle">المتجر الأسطوري</h2>
        <div id="total-coins-display">رصيدك: 🪙 <span id="shop-coins">0</span></div>
        <div class="grid-container" id="shop-grid"></div>
        <button class="btn-main btn-back" onclick="goHome()">العودة للبيت 🏠</button>
    </div>

    <div id="win-screen" class="screen">
        <h1 class="title" style="color: #00e676;">اكتملت المرحلة!</h1>
        <p style="font-size: 24px; margin-bottom: 20px;">جمعت: <span id="win-coins">0</span> 🪙</p>
        <button class="btn-main" onclick="nextLevel()">المرحلة التالية ⏩</button>
        <button class="btn-main btn-back" onclick="goHome()">العودة للبيت 🏠</button>
    </div>

    <div id="game-over-screen" class="screen">
        <h1 class="title" style="color: #f44336;">انتهت المحاولات!</h1>
        <p style="font-size: 24px; margin-bottom: 20px;">لقد جمعت: <span id="game-over-coins">0</span> 🪙 (تم حفظها)</p>
        <button class="btn-main btn-retry" onclick="startLevel(currentLevel)">إعادة المحاولة 🔄</button>
        <button class="btn-main btn-back" onclick="goHome()">العودة للبيت 🏠</button>
    </div>

    <div id="ui-layer">
        <div class="top-hud-container">
            <div class="top-row">
                <div class="hud-group">
                    <div class="home-icon-btn" onclick="quitToHome()">🏠</div>
                    <div class="score-box">🪙 <span id="score-val">0</span></div>
                </div>
                <div class="score-box">❤️ <span id="lives-val">3</span></div>
            </div>
            <div class="level-indicator">مرحلة <span id="current-level-text">1</span></div>
        </div>
        <div class="controls-bar" id="controls">
            <div class="control-group">
                <button class="control-btn" id="btn-left">◀</button>
                <button class="control-btn" id="btn-right">▶</button>
            </div>
            <button class="control-btn" id="btn-jump">⤒</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.type = 'square'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'coin') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.setValueAtTime(1200, now + 0.05);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'hit') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
            gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'click') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        }
    }

    document.addEventListener('pointerdown', function(e) {
        if(e.target.tagName === 'BUTTON' || e.target.classList.contains('home-icon-btn') || e.target.closest('button')) {
            initAudio();
            playSound('click');
        }
    });

    let totalCoins = parseInt(localStorage.getItem('superdrix_coins')) || 0;
    let unlockedLevels = parseInt(localStorage.getItem('superdrix_unlocked_levels')) || 1;
    let unlockedSkins = JSON.parse(localStorage.getItem('superdrix_skins')) || [0];
    let currentSkinId = parseInt(localStorage.getItem('superdrix_current_skin')) || 0;

    const skinsData = [
        { id: 0, name: 'رُوكْ فِيكْس', cost: 0, color: '#e52521', eyes: '#ffffff', trail: ['#ffffff', '#ff9999', '#99ccff'], crown: false },
        { id: 1, name: 'النينجا الأزرق', cost: 100, color: '#00bcd4', eyes: '#ffeb3b', trail: ['#e0f7fa', '#80deea', '#26c6da'], crown: false },
        { id: 2, name: 'الملك الذهبي', cost: 300, color: '#ffcc00', eyes: '#000000', trail: ['#fffde7', '#fff59d', '#ffeb3b'], crown: false },
        { id: 3, name: 'سایبر نيون', cost: 500, color: '#9c27b0', eyes: '#00e676', trail: ['#e1bee7', '#ba68c8', '#7b1fa2'], crown: false },
        { id: 4, name: 'الفضاء الحارق', cost: 800, color: '#ff5722', eyes: '#ffff00', trail: ['#ffccbc', '#ff7043', '#d84315'], crown: false },
        { id: 5, name: 'شبح الظلام', cost: 1200, color: '#212121', eyes: '#00bcd4', trail: ['#bdbdbd', '#757575', '#212121'], crown: false },
        { id: 6, name: 'الملك الأسطوري', cost: 2000, color: '#ffd700', eyes: '#ff0000', trail: ['#ffea00', '#ff9100', '#ff3d00'], crown: true }
    ];

    const maxLevels = 6;
    let currentLevel = 1;
    let score = 0, lives = 3, gameActive = false;
    let isLooping = false;

    function updateDisplayData() {
        document.getElementById('home-coins').innerText = totalCoins;
        document.getElementById('shop-coins').innerText = totalCoins;
        localStorage.setItem('superdrix_coins', totalCoins);
        localStorage.setItem('superdrix_unlocked_levels', unlockedLevels);
        localStorage.setItem('superdrix_skins', JSON.stringify(unlockedSkins));
        localStorage.setItem('superdrix_current_skin', currentSkinId);
    }

    function showScreen(id) {
        initAudio();
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById('ui-layer').style.display = 'none';
        if (id) document.getElementById(id).style.display = 'flex';
        updateDisplayData();
    }

    function goHome() { gameActive = false; showScreen('home-screen'); }
    function quitToHome() { if(confirm("هل أنت متأكد أنك تريد الخروج؟ ستفقد تقدمك في هذه المرحلة.")) goHome(); }

    function openShop() {
        showScreen('shop-screen');
        const grid = document.getElementById('shop-grid'); grid.innerHTML = '';
        skinsData.forEach(skin => {
            const isUnlocked = unlockedSkins.includes(skin.id);
            const isEquipped = currentSkinId === skin.id;
            let btnHtml = isEquipped ? `<button class="buy-btn equipped" disabled>مُجهز ✔️</button>` : 
                          isUnlocked ? `<button class="buy-btn" onclick="equipSkin(${skin.id})">استخدام</button>` : 
                          `<button class="buy-btn" ${totalCoins < skin.cost ? 'disabled' : ''} onclick="buySkin(${skin.id}, ${skin.cost})">شراء 🪙 ${skin.cost}</button>`;
            grid.innerHTML += `<div class="card"><div style="width: 45px; height: 45px; background:${skin.color}; margin: 0 auto 8px; border: 3px solid #000; border-radius: 8px; position:relative;">${skin.crown ? '<div style="position:absolute; top:-12px; left:10px; font-size:16px;">👑</div>' : ''}</div><div class="card-title">${skin.name}</div>${btnHtml}</div>`;
        });
    }

    function buySkin(id, cost) { if (totalCoins >= cost) { totalCoins -= cost; unlockedSkins.push(id); equipSkin(id); openShop(); } }
    function equipSkin(id) { currentSkinId = id; updateDisplayData(); openShop(); }

    function openLevelsScreen() {
        showScreen('levels-screen');
        const grid = document.getElementById('levels-grid'); grid.innerHTML = '';
        for (let i = 1; i <= maxLevels; i++) {
            let isUnlocked = i <= unlockedLevels;
            grid.innerHTML += `<div class="card ${isUnlocked ? '' : 'locked'}"><div style="font-size: 26px; margin-bottom: 5px;">${isUnlocked ? i : '🔒'}</div><div class="card-title">مرحلة ${i}</div>${isUnlocked ? `<button class="level-btn" onclick="startLevel(${i})">العب</button>` : ''}</div>`;
        }
    }

    function triggerGameOver() {
        gameActive = false;
        totalCoins += score;
        document.getElementById('game-over-coins').innerText = score;
        showScreen('game-over-screen');
    }

    function startLevel(lvl) {
        initAudio();
        currentLevel = lvl; score = 0; lives = 3;
        document.getElementById('current-level-text').innerText = currentLevel;
        document.getElementById('score-val').innerText = score;
        document.getElementById('lives-val').innerText = lives;
        
        showScreen(''); 
        document.getElementById('ui-layer').style.display = 'flex';
        initLevel(currentLevel);
        
        gameActive = true; 
        if (!isLooping) {
            isLooping = true;
            requestAnimationFrame(loop);
        }
    }

    function winLevel() {
        gameActive = false; totalCoins += score;
        if (currentLevel === unlockedLevels && unlockedLevels < maxLevels) unlockedLevels++;
        document.getElementById('win-coins').innerText = score; showScreen('win-screen');
    }

    function nextLevel() {
        if (currentLevel < maxLevels) startLevel(currentLevel + 1);
        else { alert("لقد أنهيت جميع المراحل الأسطورية الحالية! مبروك يا بطل!"); goHome(); }
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();

    let player, blocks = [], coins = [], enemies = [], clouds = [], particles = [], finishLine = null;
    let cameraX = 0, shakeTime = 0;

    function initLevel(lvl) {
        blocks = []; coins = []; enemies = []; clouds = []; particles = [];
        let activeSkin = skinsData.find(s => s.id === currentSkinId) || skinsData[0];
        player = { x: 100, y: 200, width: 45, height: 45, vx: 0, vy: 0, speed: 6, jumpForce: -13, grounded: false, dir: 1, trail: [], color: activeSkin.color, eyesColor: activeSkin.eyes, trailColors: activeSkin.trail, crown: activeSkin.crown };
        let levelLength = 2000 + (lvl * 1200);
        finishLine = { x: levelLength - 300, y: canvas.height - 250, width: 60, height: 170 };

        for (let i = 0; i < levelLength / 55; i++) {
            if (Math.random() > 0.05 + (lvl * 0.015)) blocks.push({ x: i * 55, y: canvas.height - 80, width: 55, height: 80, type: 'ground' });
        }

        for (let i = 400; i < finishLine.x; i += 280) {
            if (Math.random() > 0.3) {
                blocks.push({ x: i, y: canvas.height - 180 - Math.random() * 80, width: 140, height: 35, type: 'brick' });
                coins.push({ x: i + 50, y: canvas.height - 300, width: 26, height: 26, collected: false, float: Math.random() * Math.PI });
            }
            if (Math.random() > 0.4) enemies.push({ x: i + 100, y: canvas.height - 130, width: 45, height: 45, vx: 2 + (lvl * 0.4), minX: i, maxX: i + 280, alive: true });
            coins.push({ x: i + 140, y: canvas.height - 150, width: 26, height: 26, collected: false, float: 0 });
        }
        for (let i = 0; i < 30; i++) clouds.push({ x: i * 300 + Math.random() * 100, y: 30 + Math.random() * 100, size: 40 + Math.random() * 40 });
        cameraX = 0;
    }

    function createParticles(x, y, color) {
        for(let i = 0; i < 15; i++) particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10, life: 1, color: color, size: Math.random() * 6 + 2 });
    }

    let moveLeft = false, moveRight = false;
    function setupControls() {
        const bindBtn = (id, start, end) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); start(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); end(); });
            el.addEventListener('mousedown', () => { initAudio(); start(); });
            el.addEventListener('mouseup', end);
        };
        bindBtn('btn-left', () => moveLeft = true, () => moveLeft = false);
        bindBtn('btn-right', () => moveRight = true, () => moveRight = false);
        document.getElementById('btn-jump').addEventListener('click', () => {
            initAudio(); 
            if (player.grounded) { 
                player.vy = player.jumpForce; player.grounded = false; 
                playSound('jump'); 
                createParticles(player.x + 20, player.y + 40, '#ffffff'); 
            }
        });
    }

    function update() {
        if (!gameActive) return;

        player.vx = 0;
        if (moveLeft) { player.vx = -player.speed; player.dir = -1; }
        if (moveRight) { player.vx = player.speed; player.dir = 1; }
        player.x += player.vx;
        player.vy += 0.6; 
        player.y += player.vy;
        player.grounded = false;

        if (Math.abs(player.vx) > 0 || player.vy !== 0) {
            player.trail.push({ x: player.x, y: player.y });
            if (player.trail.length > 10) player.trail.shift();
        } else if (player.trail.length > 0) player.trail.shift();

        particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.04; });
        particles = particles.filter(p => p.life > 0);

        blocks.forEach(b => {
            if (player.x + player.width > b.x && player.x < b.x + b.width && player.y + player.height > b.y && player.y < b.y + b.height) {
                if (player.vy > 0 && player.y + player.height - player.vy <= b.y + 12) {
                    player.y = b.y - player.height; player.vy = 0; player.grounded = true;
                } else if (player.vy < 0 && player.y - player.vy >= b.y + b.height - 12) {
                    player.y = b.y + b.height; player.vy = 0;
                }
            }
        });

        enemies.forEach(en => {
            if (!en.alive) return;
            en.x += en.vx; if (en.x < en.minX || en.x > en.maxX) en.vx *= -1;
            if (player.x + player.width > en.x && player.x < en.x + en.width && player.y + player.height > en.y && player.y < en.y + en.height) {
                if (player.vy > 0 && player.y + player.height - player.vy <= en.y + 15) {
                    en.alive = false; player.vy = -9; score += 50; document.getElementById('score-val').innerText = score;
                    playSound('jump'); 
                    createParticles(en.x + 20, en.y + 20, '#ff0000');
                } else {
                    playSound('hit'); 
                    lives--; document.getElementById('lives-val').innerText = lives;
                    shakeTime = 15; player.vy = -6; player.x += (player.x < en.x) ? -50 : 50; createParticles(player.x, player.y, player.color);
                    if (lives <= 0) { triggerGameOver(); }
                }
            }
        });

        coins.forEach(c => {
            c.float += 0.1; c.y += Math.sin(c.float) * 0.5;
            if (!c.collected && player.x + player.width > c.x && player.x < c.x + c.width && player.y + player.height > c.y && player.y < c.y + c.height) {
                c.collected = true; score += 10; document.getElementById('score-val').innerText = score;
                playSound('coin'); 
                createParticles(c.x + 13, c.y + 13, '#ffcc00');
            }
        });

        if (player.y > canvas.height) {
            playSound('hit'); 
            lives--; document.getElementById('lives-val').innerText = lives; shakeTime = 20;
            player.x = cameraX + 100; player.y = 50; player.vy = 0;
            if (lives <= 0) { triggerGameOver(); }
        }

        if (finishLine && player.x + player.width > finishLine.x && player.x < finishLine.x + finishLine.width) {
            playSound('coin');
            createParticles(player.x, player.y, '#00e676');
            createParticles(player.x+20, player.y-20, '#ffcc00');
            winLevel();
        }

        cameraX += ((player.x - canvas.width / 3) - cameraX) * 0.1; 
        if (cameraX < 0) cameraX = 0;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        
        let shakeX = 0, shakeY = 0;
        if (shakeTime > 0) { shakeX = (Math.random() - 0.5) * 12; shakeY = (Math.random() - 0.5) * 12; shakeTime--; }
        ctx.translate(-cameraX + shakeX, shakeY);

        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        clouds.forEach(cl => {
            ctx.beginPath(); ctx.arc(cl.x, cl.y, cl.size * 0.5, 0, Math.PI * 2);
            ctx.arc(cl.x + cl.size * 0.4, cl.y - cl.size * 0.2, cl.size * 0.4, 0, Math.PI * 2);
            ctx.arc(cl.x + cl.size * 0.8, cl.y, cl.size * 0.45, 0, Math.PI * 2); ctx.fill();
        });

        if (finishLine) {
            ctx.fillStyle = "#fff"; ctx.fillRect(finishLine.x, finishLine.y, 10, finishLine.height);
            ctx.fillStyle = "#00e676"; ctx.fillRect(finishLine.x + 10, finishLine.y, finishLine.width, 40);
            ctx.fillStyle = "#000"; ctx.font = "20px Changa"; ctx.fillText("النهاية", finishLine.x + 15, finishLine.y + 28);
        }

        blocks.forEach(b => {
            if (b.type === 'ground') {
                ctx.fillStyle = "#d95700"; ctx.fillRect(b.x, b.y + 15, b.width, b.height - 15);
                ctx.fillStyle = "#38b764"; ctx.fillRect(b.x, b.y, b.width, 18);
                ctx.strokeStyle = "#1b5e20"; ctx.lineWidth = 3; ctx.strokeRect(b.x, b.y, b.width, 18);
            } else {
                ctx.fillStyle = "#e67e22"; ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.strokeStyle = "#873600"; ctx.lineWidth = 3; ctx.strokeRect(b.x, b.y, b.width, b.height);
            }
        });

        coins.forEach(c => {
            if (!c.collected) {
                ctx.fillStyle = "#ffcc00"; ctx.beginPath(); ctx.arc(c.x + c.width/2, c.y + c.height/2, c.width/2, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
            }
        });

        enemies.forEach(en => {
            if (en.alive) {
                ctx.fillStyle = "#7b1fa2"; ctx.fillRect(en.x, en.y, en.width, en.height);
                ctx.fillStyle = "#ffeb3b"; ctx.fillRect(en.x + 8, en.y + 10, 10, 10); ctx.fillRect(en.x + 28, en.y + 10, 10, 10);
            }
        });

        if(player && player.trailColors) {
            player.trail.forEach((t, i) => {
                ctx.globalAlpha = (i / player.trail.length) * 0.6;
                ctx.fillStyle = player.trailColors[i % 3];
                ctx.fillRect(t.x + 2, t.y + 2, player.width - 4, player.height - 4);
            });
            ctx.globalAlpha = 1.0;
        }

        if(player) {
            if(player.crown) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#ffea00";
            }

            ctx.fillStyle = "#000000"; ctx.fillRect(player.x - 3, player.y - 3, player.width + 6, player.height + 6);
            ctx.fillStyle = player.color; ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.shadowBlur = 0;

            ctx.fillStyle = player.eyesColor;
            let eyeOffset = player.dir === 1 ? 4 : -4;
            ctx.fillRect(player.x + 10 + eyeOffset, player.y + 12, 8, 10);
            ctx.fillRect(player.x + 26 + eyeOffset, player.y + 12, 8, 10);

            if(player.crown) {
                ctx.fillStyle = "#ffcc00";
                ctx.beginPath();
                ctx.moveTo(player.x + 5, player.y - 2);
                ctx.lineTo(player.x + 10, player.y - 14);
                ctx.lineTo(player.x + 22, player.y - 6);
                ctx.lineTo(player.x + 35, player.y - 14);
                ctx.lineTo(player.x + 40, player.y - 2);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        particles.forEach(p => {
            ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        ctx.restore();
    }

    function loop() { 
        if(!gameActive) {
            isLooping = false; 
            return;
        }
        update(); 
        draw(); 
        requestAnimationFrame(loop); 
    }
    
    setupControls();
    goHome();
</script>
</body>
</html>
