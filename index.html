<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SuperDrix 3D - Ultimate Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Arial', sans-serif; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #5c94fc; }
        
        #game-canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        .top-hud { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .score-box { background: rgba(0, 0, 0, 0.75); color: #ffcc00; padding: 10px 22px; border-radius: 25px; font-size: 24px; font-weight: 900; border: 3px solid #fff; }
        
        .controls-bar {
            position: absolute; bottom: 30px; width: 100%; left: 0; display: flex; justify-content: space-between; padding: 0 30px; z-index: 20; pointer-events: auto;
        }
        .control-btn {
            width: 75px; height: 75px; background: rgba(255, 255, 255, 0.9); border: 4px solid #333; border-radius: 50%;
            font-size: 28px; font-weight: bold; color: #333; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 6px 0px rgba(0,0,0,0.4); cursor: pointer;
        }
        .control-btn:active { transform: translateY(4px); box-shadow: 0 2px 0px rgba(0,0,0,0.4); }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            z-index: 30; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; gap: 20px; text-align: center;
        }
        #start-screen h1 { font-size: 45px; color: #ffcc00; text-shadow: 4px 4px #d32f2f; font-weight: 900; }
        .start-btn { background: #00e676; color: #000; font-size: 24px; font-weight: 900; padding: 15px 45px; border-radius: 35px; border: 4px solid #fff; cursor: pointer; box-shadow: 0 6px 0px #00793c; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>SUPERDRIX 3D</h1>
        <p style="font-size: 18px; font-weight: bold;">تجنب الوحوش، اجمع العملات، وانطلق في عالم ضخم!</p>
        <button class="start-btn" onclick="startGame()">▶ ابدأ اللعبة</button>
    </div>

    <div id="ui-layer">
        <div class="top-hud">
            <div class="score-box">🪙 <span id="score-val">0</span></div>
            <div class="score-box">❤️ <span id="lives-val">3</span></div>
        </div>
    </div>

    <div class="controls-bar">
        <div style="display: flex; gap: 15px;">
            <button class="control-btn" id="btn-left">◀</button>
            <button class="control-btn" id="btn-right">▶</button>
        </div>
        <button class="control-btn" id="btn-jump">⤒</button>
    </div>

    <div id="game-canvas"></div>

<script>
    // --- المؤثرات الصوتية ---
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(400, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'coin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.setValueAtTime(950, now + 0.08);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
            osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.linearRampToValueAtTime(40, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        }
    }

    let scene, camera, renderer;
    let player, platforms = [], coins = [], monsters = [];
    let score = 0, lives = 3;
    let gameActive = false;

    let playerVelocity = new THREE.Vector3(0, 0, 0);
    let isGrounded = false;
    let moveLeft = false, moveRight = false;
    let facingDirection = 1; // 1 يمين، -1 يسار (ليظل الوجه ظاهراً دائماً)

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x5c94fc);
        scene.fog = new THREE.Fog(0x5c94fc, 35, 90);

        // كاميرا واسعة وبعيدة لرؤية عالم ضخم
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 24);
        camera.lookAt(0, 1, 0);

        renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('game-canvas').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 25, 15);
        scene.add(dirLight);

        createPlayer();
        createHugeLevel();
        setupControls();
        animate();
    }

    // تصميم المكعب الشرس مع جعل الوجه يلتفت باتجاه الحركة لئلا يختفي أبداً
    function createPlayer() {
        const playerGroup = new THREE.Group();

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe52521, roughness: 0.3 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), bodyMat);
        body.position.y = 0.6;
        playerGroup.add(body);

        // مجموعة الوجه الأمامية التي تدور مع اتجاه اللاعب
        const faceGroup = new THREE.Group();
        faceGroup.position.z = 0.61;

        const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const eyePupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

        const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.25, 0.05), eyeWhiteMat);
        eyeR.position.set(0.25, 0.75, 0);
        faceGroup.add(eyeR);
        const pupilR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.08), eyePupilMat);
        pupilR.position.set(0.32, 0.75, 0.02);
        faceGroup.add(pupilR);

        const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.25, 0.05), eyeWhiteMat);
        eyeL.position.set(-0.25, 0.75, 0);
        faceGroup.add(eyeL);
        const pupilL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.08), eyePupilMat);
        pupilL.position.set(-0.18, 0.75, 0.02);
        faceGroup.add(pupilL);

        playerGroup.add(faceGroup);
        playerGroup.userData.faceGroup = faceGroup; // لحفظ الإشارة

        player = playerGroup;
        player.position.set(0, 3, 0);
        scene.add(player);
    }

    // بناء عالم ضخم وطويل مليء بالمنصات والعملات والوحوش
    function createHugeLevel() {
        for (let i = -3; i < 35; i++) {
            let xPos = i * 4;
            // تصميم تضاريس متدرجة (مرتفعات ومنخفضات)
            let yPos = (i > 6 && i < 11) ? 2 : (i >= 15 && i < 20) ? 3 : (i >= 25 ? 1 : 0);
            
            // قاعدة ترابية
            let groundMat = new THREE.MeshStandardMaterial({ color: 0xd95700, roughness: 0.9 });
            let groundMesh = new THREE.Mesh(new THREE.BoxGeometry(3.8, 2.0, 3.8), groundMat);
            groundMesh.position.set(xPos, yPos - 1.0, 0);
            scene.add(groundMesh);
            platforms.push(groundMesh);

            // طبقة عشب خضراء
            let grassMat = new THREE.MeshStandardMaterial({ color: 0x38b764, roughness: 0.8 });
            let grassMesh = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.35, 3.8), grassMat);
            grassMesh.position.set(xPos, yPos + 0.17, 0);
            scene.add(grassMesh);
            platforms.push(grassMesh);

            // إضافة عملات ذهبية
            if (i > 1 && i % 2 === 0) {
                createCoin(xPos, yPos + 2.2, 0);
            }

            // إضافة وحوش تتجول على المنصات في مناطق متفرقة
            if (i > 4 && i % 4 === 0) {
                createMonster(xPos, yPos + 0.6);
            }
        }
    }

    function createCoin(x, y, z) {
        const mat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.6, roughness: 0.2, emissive: 0x443300 });
        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.15, 20), mat);
        mesh.rotation.x = Math.PI / 2;
        mesh.position.set(x, y, z);
        scene.add(mesh);
        coins.push(mesh);
    }

    // إنشاء وحش شرس يتحرك يميناً ويساراً
    function createMonster(x, y) {
        const monsterGroup = new THREE.Group();
        // جسم الوحش (بنفسجي أو أزرق داكن بشرس)
        const mat = new THREE.MeshStandardMaterial({ color: 0x7b1fa2, roughness: 0.5 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.9, 1.0), mat);
        body.position.y = 0.45;
        monsterGroup.add(body);

        // عيون شرسة للوحش
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffeb3b });
        const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.1), eyeMat);
        eye1.position.set(0.2, 0.6, 0.52);
        monsterGroup.add(eye1);
        const eye2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.1), eyeMat);
        eye2.position.set(-0.2, 0.6, 0.52);
        monsterGroup.add(eye2);

        monsterGroup.position.set(x, y, 0);
        scene.add(monsterGroup);

        monsters.push({
            mesh: monsterGroup,
            startX: x,
            range: 2.0,
            speed: 0.04,
            direction: 1
        });
    }

    function setupControls() {
        const bindButton = (id, startAction, endAction) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); startAction(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); endAction(); });
            el.addEventListener('mousedown', () => { initAudio(); startAction(); });
            el.addEventListener('mouseup', () => endAction());
        };

        bindButton('btn-left', () => moveLeft = true, () => moveLeft = false);
        bindButton('btn-right', () => moveRight = true, () => moveRight = false);
        
        document.getElementById('btn-jump').addEventListener('click', () => {
            initAudio();
            if (isGrounded) {
                playerVelocity.y = 0.25;
                isGrounded = false;
                playSound('jump');
            }
        });

        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
            if ((e.key === ' ' || e.key === 'ArrowUp') && isGrounded) {
                playerVelocity.y = 0.25;
                isGrounded = false;
                playSound('jump');
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
        });
    }

    function startGame() {
        initAudio();
        document.getElementById('start-screen').style.display = 'none';
        gameActive = true;
    }

    let animTimer = 0;

    function animate() {
        requestAnimationFrame(animate);

        if (gameActive) {
            // حركة اللاعب وتوجيه الوجه باتجاه الحركة لئلا يختفي أبدًا
            if (moveLeft) {
                player.position.x -= 0.14;
                facingDirection = -1;
                player.rotation.y = Math.PI; // تدوير الجسم لليسار
                animTimer += 0.25;
                player.position.y += Math.sin(animTimer) * 0.04;
            } else if (moveRight) {
                player.position.x += 0.14;
                facingDirection = 1;
                player.rotation.y = 0; // تدوير الجسم لليمين
                animTimer += 0.25;
                player.position.y += Math.sin(animTimer) * 0.04;
            }

            // حركة الوحوش ذهاباً وإياباً على المنصات
            monsters.forEach(m => {
                m.mesh.position.x += m.speed * m.direction;
                if (m.mesh.position.x > m.startX + m.range || m.mesh.position.x < m.startX - m.range) {
                    m.direction *= -1;
                }

                // فحص الاصطدام بين اللاعب والوحش
                if (player.position.distanceTo(m.mesh.position) < 1.1) {
                    playSound('hit');
                    lives--;
                    document.getElementById('lives-val').innerText = lives;
                    player.position.set(player.position.x - 2, 5, 0); // إرجاع اللاعب للخلف قليلاً
                    playerVelocity.set(0, 0, 0);
                    if (lives <= 0) {
                        alert('انتهت اللعبة! الأعداء ألحقوا بك الضرر.');
                        location.reload();
                    }
                }
            });

            // الجاذبية والفيزياء
            playerVelocity.y -= 0.012;
            player.position.y += playerVelocity.y;

            // اصطدام المنصات
            isGrounded = false;
            platforms.forEach(plat => {
                if (player.position.x >= plat.position.x - 2 && player.position.x <= plat.position.x + 2 &&
                    player.position.y >= plat.position.y - 0.5 && player.position.y <= plat.position.y + 1.5 &&
                    playerVelocity.y <= 0) {
                    player.position.y = plat.position.y + 1.1;
                    playerVelocity.y = 0;
                    isGrounded = true;
                }
            });

            // جمع العملات
            coins.forEach((coin, index) => {
                coin.rotation.z += 0.06;
                if (player.position.distanceTo(coin.position) < 1.4) {
                    scene.remove(coin);
                    coins.splice(index, 1);
                    score += 10;
                    document.getElementById('score-val').innerText = score;
                    playSound('coin');
                }
            });

            // السقوط في الفراغ
            if (player.position.y < -10) {
                playSound('hit');
                lives--;
                document.getElementById('lives-val').innerText = lives;
                player.position.set(player.position.x, 5, 0);
                playerVelocity.set(0, 0, 0);
                if (lives <= 0) {
                    alert('انتهت اللعبة!');
                    location.reload();
                }
            }

            // الكاميرا تتبع اللاعب بسلاسة في عالم واسع وبعيد
            camera.position.x += (player.position.x - camera.position.x) * 0.08;
            camera.position.y += ((player.position.y + 5) - camera.position.y) * 0.08;
        }

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
</script>
</body>
</html>
