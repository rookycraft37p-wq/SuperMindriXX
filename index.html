<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mindrix Pro - 100 Levels & Skins</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@700;800&display=swap');
        
        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-touch-callout: none;
            margin: 0; 
            padding: 0; 
            touch-action: manipulation; 
        }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Changa', sans-serif; }
        canvas { display: block; }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 20, 30, 0.98);
            z-index: 30; display: none; flex-direction: column; justify-content: flex-start; align-items: center; color: white; text-align: center;
            overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 30px 15px;
        }
        #home-screen { justify-content: center; background: radial-gradient(circle, #2b2b4e, #1a1a2e); }
        
        h1.title { font-size: 50px; color: #00e676; text-shadow: 0 0 15px rgba(0,230,118,0.6), 4px 4px #000; font-weight: 900; letter-spacing: 2px; margin-bottom: 5px; }
        h2.subtitle { font-size: 32px; color: #ffcc00; text-shadow: 2px 2px #000; margin-bottom: 20px; }

        .btn-main { background: #00e676; color: #000; font-size: 20px; font-weight: 800; padding: 12px 30px; margin: 8px; border-radius: 40px; border: 4px solid #fff; cursor: pointer; box-shadow: 0 6px 0px #00793c; transition: all 0.1s; width: 280px; }
        .btn-main:active { transform: translateY(6px); box-shadow: 0 0px 0px #00793c; }
        .btn-shop { background: #ff9800; box-shadow: 0 6px 0px #e65100; color: #fff; text-shadow: 1px 1px 2px #000;}
        .btn-levels { background: #03a9f4; box-shadow: 0 6px 0px #01579b; color: #fff; }
        .btn-back { background: #f44336; box-shadow: 0 6px 0px #b71c1c; margin: 30px 0; color: #fff; }
        .btn-retry { background: #ffcc00; box-shadow: 0 6px 0px #f57f17; }

        .grid-container { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 850px; padding: 10px; margin-bottom: 20px; }
        
        .card { background: rgba(255,255,255,0.08); border: 3px solid #555; border-radius: 15px; padding: 12px; width: 150px; text-align: center; backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: relative; transition: 0.2s; }
        .card.locked { opacity: 0.4; filter: grayscale(100%); pointer-events: none; }
        .card-title { font-size: 15px; margin-bottom: 5px; font-weight: bold; text-shadow: 1px 1px #000; }
        
        .card.tier-rare { border-color: #00bcd4; box-shadow: 0 0 10px rgba(0,188,212,0.5); }
        .card.tier-epic { border-color: #9c27b0; box-shadow: 0 0 15px rgba(156,39,176,0.6); }
        .card.tier-legendary { border-color: #ff4500; box-shadow: 0 0 25px rgba(255,69,0,0.8), 0 0 40px #ffea00; }
        .card.tier-rainbow { border-color: #ff00ff; box-shadow: 0 0 30px #00ffff, 0 0 50px #ff00ff; animation: rainbowGlow 2s infinite linear; }

        @keyframes rainbowGlow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

        .buy-btn, .level-btn { background: #ffcc00; color: #000; font-weight: 800; border: 2px solid #000; padding: 6px 8px; border-radius: 10px; width: 100%; cursor: pointer; margin-top: 6px; font-size: 14px; }
        .buy-btn:disabled { background: #444; color: #888; cursor: not-allowed; border-color: #222; }
        .buy-btn.equipped { background: #00e676; border-color: #fff; color: #fff; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            display: none; flex-direction: column; justify-content: space-between; padding: 15px;
        }
        .top-hud-container { width: 100%; pointer-events: auto; }
        .top-row { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .hud-group { display: flex; gap: 10px; align-items: center; }
        
        .score-box { background: rgba(0, 0, 0, 0.75); color: #ffcc00; padding: 5px 15px; border-radius: 20px; font-size: 18px; font-weight: 900; border: 2px solid #fff; display: flex; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .home-icon-btn { font-size: 18px; background: #fff; border: 2px solid #111; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 0px #111; }
        .home-icon-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px #111; }

        .level-indicator { background: rgba(0,0,0,0.8); color: #fff; padding: 3px 20px; border-radius: 20px; font-size: 16px; font-weight: bold; border: 2px solid #00e676; margin: 10px auto 0; width: fit-content; text-shadow: 1px 1px #000; }

        .controls-bar {
            position: absolute; bottom: 25px; width: 100%; left: 0; display: flex; justify-content: space-between; padding: 0 25px; z-index: 20; pointer-events: auto; direction: ltr;
        }
        .control-group { display: flex; gap: 15px; }
        .control-btn {
            width: 75px; height: 75px; background: rgba(255, 255, 255, 0.85); border: 4px solid #111; border-radius: 50%; font-size: 30px; font-weight: bold; color: #111; display: flex; justify-content: center; align-items: center; box-shadow: 0 6px 0px rgba(0,0,0,0.6); cursor: pointer;
        }
        .control-btn:active { transform: translateY(6px); box-shadow: 0 0px 0px rgba(0,0,0,0.6); background: #ccc; }
        #btn-jump { background: #ffcc00; color: #111; }

        #total-coins-display { font-size: 20px; color: #ffcc00; font-weight: bold; margin-bottom: 15px; background: rgba(0,0,0,0.6); padding: 6px 15px; border-radius: 20px; border: 2px solid #fff; }
    </style>
</head>
<body>

    <div id="home-screen" class="screen">
        <h1 class="title">SUPERDRIX</h1>
        <div id="total-coins-display">🪙 <span id="home-coins">0</span></div>
        <button class="btn-main" onclick="openLevelsScreen()">▶ المراحل (100)</button>
        <button class="btn-main btn-shop" onclick="openShop()">🛒 المتجر (100 شخصية)</button>
    </div>

    <div id="levels-screen" class="screen">
        <h2 class="subtitle">اختر المرحلة (1 إلى 100)</h2>
        <div class="grid-container" id="levels-grid"></div>
        <button class="btn-main btn-back" onclick="goHome()">العودة للبيت 🏠</button>
    </div>

    <div id="shop-screen" class="screen">
        <h2 class="subtitle">المتجر الأسطوري (100 شخصية)</h2>
        <div id="total-coins-display">رصيدك: 🪙 <span id="shop-coins">0</span></div>
        <div class="grid-container" id="shop-grid"></div>
        <button class="btn-main btn-back" onclick="goHome()">العودة للبيت 🏠</button>
    </div>

    <div id="win-screen" class="screen" style="justify-content: center;">
        <h1 class="title" style="color: #00e676;">اكتملت المرحلة!</h1>
        <p style="font-size: 24px; margin-bottom: 15px;">جمعت: <span id="win-coins">0</span> 🪙</p>
        <button class="btn-main" onclick="nextLevel()">المرحلة التالية ⏩</button>
        <button class="btn-main btn-back" onclick="goHome()" style="margin: 8px;">العودة للبيت 🏠</button>
    </div>

    <div id="game-over-screen" class="screen" style="justify-content: center;">
        <h1 class="title" style="color: #f44336; text-shadow: 0 0 15px rgba(244,67,54,0.6), 4px 4px #000;">انتهت المحاولات!</h1>
        <p style="font-size: 22px; margin-bottom: 15px;">النقاط المحفوظة: <span id="game-over-coins">0</span> 🪙</p>
        <button class="btn-main btn-retry" onclick="startLevel(currentLevel)">إعادة المحاولة 🔄</button>
        <button class="btn-main btn-back" onclick="goHome()" style="margin: 8px;">العودة للبيت 🏠</button>
    </div>

    <div id="ui-layer">
        <div class="top-hud-container">
            <div class="top-row">
                <div class="hud-group">
                    <div class="home-icon-btn" onclick="quitToHome()">🏠</div>
                    <div class="score-box">🪙 <span id="score-val">0</span></div>
                </div>
                <div class="score-box">❤️ <span id="lives-val">3</span></div>
            </div>
            <div class="level-indicator">مرحلة <span id="current-level-text">1</span></div>
        </div>
        <div class="controls-bar" id="controls">
            <div class="control-group">
                <button class="control-btn" id="btn-left">◀</button>
                <button class="control-btn" id="btn-right">▶</button>
            </div>
            <button class="control-btn" id="btn-jump">⤒</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.type = 'square'; osc.frequency.setValueAtTime(250, now); osc.frequency.exponentialRampToValueAtTime(500, now + 0.15);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'coin') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(1000, now); osc.frequency.setValueAtTime(1500, now + 0.08);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'hit') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
            gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'click') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1000, now + 0.05);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        }
    }

    document.addEventListener('pointerdown', function(e) {
        if(e.target.tagName === 'BUTTON' || e.target.classList.contains('home-icon-btn') || e.target.closest('button')) {
            initAudio(); playSound('click');
        }
    });

    const skinsData = [];
    for (let i = 0; i < 100; i++) {
        let cost = i === 0 ? 0 : (i === 99 ? 0 : i * 150); // جعل سعر سكن قوس قزح مجاني تماماً
        let tierClass = "tier-common";
        let tierName = "عادي";
        let crown = false;
        let isRainbow = false;
        
        if (i === 99) {
            tierClass = "tier-rainbow";
            tierName = "ملك الألوان 🌈👑";
            crown = true;
            isRainbow = true;
        } else if (i >= 85) { tierClass = "tier-legendary"; tierName = "أسطوري 🔥"; crown = true; }
        else if (i >= 50) { tierClass = "tier-epic"; tierName = "ملحمي 💎"; }
        else if (i >= 25) { tierClass = "tier-rare"; tierName = "نادر ✨"; }

        let name = i === 0 ? "رُوكْ فِيكْس" : (i === 99 ? "الملك قوس قزح 👑" : `شخصية ${i + 1}`);
        let color = isRainbow ? '#ff0000' : `hsl(${i * 3.6}, 85%, 55%)`;

        skinsData.push({
            id: i,
            name: name,
            cost: cost,
            color: color,
            eyes: '#ffeb3b',
            trail: [color, '#ffffff', '#ff9999'],
            crown: crown,
            isRainbow: isRainbow,
            tierName: tierName,
            cardClass: tierClass
        });
    }

    const maxLevels = 100;
    let totalCoins = parseInt(localStorage.getItem('superdrix_coins')) || 50000;
    let unlockedLevels = parseInt(localStorage.getItem('superdrix_unlocked_levels')) || 1;
    // جعل سكن الملك قوس قزح (رقم 99) مفتوح ومجهز افتراضياً للجميع
    let unlockedSkins = JSON.parse(localStorage.getItem('superdrix_skins')) || [0, 99];
    if(!unlockedSkins.includes(99)) unlockedSkins.push(99);
    let currentSkinId = parseInt(localStorage.getItem('superdrix_current_skin')) || 99;

    let currentLevel = 1;
    let score = 0, lives = 3, gameActive = false;
    let isLooping = false;

    function updateDisplayData() {
        document.getElementById('home-coins').innerText = totalCoins;
        document.getElementById('shop-coins').innerText = totalCoins;
        localStorage.setItem('superdrix_coins', totalCoins);
        localStorage.setItem('superdrix_unlocked_levels', unlockedLevels);
        localStorage.setItem('superdrix_skins', JSON.stringify(unlockedSkins));
        localStorage.setItem('superdrix_current_skin', currentSkinId);
    }

    function showScreen(id) {
        initAudio(); document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById('ui-layer').style.display = 'none';
        if (id) {
            const targetScreen = document.getElementById(id);
            targetScreen.style.display = 'flex';
            targetScreen.scrollTop = 0;
        }
        updateDisplayData();
    }

    function goHome() { gameActive = false; showScreen('home-screen'); }
    function quitToHome() { if(confirm("هل أنت متأكد أنك تريد الخروج؟")) goHome(); }

    function openShop() {
        showScreen('shop-screen');
        const grid = document.getElementById('shop-grid'); grid.innerHTML = '';
        skinsData.forEach(skin => {
            const isUnlocked = unlockedSkins.includes(skin.id);
            const isEquipped = currentSkinId === skin.id;
            let btnHtml = isEquipped ? `<button class="buy-btn equipped" disabled>مُجهز ✔️</button>` : 
                          isUnlocked ? `<button class="buy-btn" onclick="equipSkin(${skin.id})">استخدام</button>` : 
                          `<button class="buy-btn" ${totalCoins < skin.cost ? 'disabled' : ''} onclick="buySkin(${skin.id}, ${skin.cost})">شراء 🪙 ${skin.cost}</button>`;
            
            grid.innerHTML += `
                <div class="card ${skin.cardClass}">
                    <div style="font-size:11px; color:#ffcc00; margin-bottom:3px;">#${skin.id + 1} (${skin.tierName})</div>
                    <div style="width: 45px; height: 45px; background:${skin.isRainbow ? 'linear-gradient(45deg, red, yellow, green, cyan, magenta)' : skin.color}; margin: 0 auto 8px; border: 3px solid #000; border-radius: 8px; position:relative; box-shadow: 0 4px 8px rgba(0,0,0,0.5);">
                        ${skin.crown ? '<div style="position:absolute; top:-16px; left:10px; font-size:18px; text-shadow: 1px 1px 0 #000;">👑</div>' : ''}
                    </div>
                    <div class="card-title">${skin.name}</div>
                    ${btnHtml}
                </div>`;
        });
    }

    function buySkin(id, cost) { if (totalCoins >= cost) { totalCoins -= cost; unlockedSkins.push(id); equipSkin(id); } }
    function equipSkin(id) { currentSkinId = id; updateDisplayData(); openShop(); }

    function openLevelsScreen() {
        showScreen('levels-screen');
        const grid = document.getElementById('levels-grid'); grid.innerHTML = '';
        for (let i = 1; i <= maxLevels; i++) {
            let isUnlocked = i <= unlockedLevels;
            grid.innerHTML += `
                <div class="card ${isUnlocked ? '' : 'locked'}" style="width: 75px; height: 75px; justify-content: center; align-items: center; display: flex; flex-direction: column;">
                    <div style="font-size: 20px; font-weight: bold; text-shadow: 2px 2px #000;">${isUnlocked ? i : '🔒'}</div>
                    ${isUnlocked ? `<button class="level-btn" style="padding: 2px; font-size: 11px;" onclick="startLevel(${i})">العب</button>` : ''}
                </div>`;
        }
    }

    function triggerGameOver() {
        gameActive = false; totalCoins += score;
        document.getElementById('game-over-coins').innerText = score; showScreen('game-over-screen');
    }

    function startLevel(lvl) {
        initAudio(); currentLevel = lvl; score = 0; lives = 3;
        document.getElementById('current-level-text').innerText = currentLevel;
        document.getElementById('score-val').innerText = score; document.getElementById('lives-val').innerText = lives;
        
        showScreen(''); document.getElementById('ui-layer').style.display = 'flex';
        initLevel(currentLevel);
        gameActive = true; 
        if (!isLooping) { isLooping = true; requestAnimationFrame(loop); }
    }

    function winLevel() {
        gameActive = false; totalCoins += score;
        if (currentLevel === unlockedLevels && unlockedLevels < maxLevels) unlockedLevels++;
        document.getElementById('win-coins').innerText = score; showScreen('win-screen');
    }
    function nextLevel() {
        if (currentLevel < maxLevels) startLevel(currentLevel + 1);
        else { alert("مبروك! لقد ختمت جميع المراحل الـ 100 بنجاح!"); goHome(); }
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();

    let player, blocks = [], hazards = [], coins = [], enemies = [], clouds = [], particles = [], floatingTexts = [], finishLine = null;
    let cameraX = 0, shakeTime = 0, backgroundY = 0;

    function initLevel(lvl) {
        blocks = []; hazards = []; coins = []; enemies = []; clouds = []; particles = []; floatingTexts = [];
        let activeSkin = skinsData[currentSkinId] || skinsData[99];
        
        player = { 
            x: 100, y: 200, width: 45, height: 45, vx: 0, vy: 0, speed: 6.5, jumpForce: -14.5, grounded: false, dir: 1, trail: [], 
            color: activeSkin.color, eyesColor: activeSkin.eyes, trailColors: activeSkin.trail, crown: activeSkin.crown, isRainbow: activeSkin.isRainbow, scaleX: 1, scaleY: 1 
        };
        
        let levelLength = 3000 + (lvl * 300);
        finishLine = { x: levelLength - 300, y: canvas.height - 350, width: 80, height: 270 };

        let cursorX = 0;
        while (cursorX < levelLength) {
            let groundWidth = 300 + Math.random() * 250;
            let baseHeightY = canvas.height - 120;
            
            blocks.push({ x: cursorX, y: baseHeightY, width: groundWidth, height: 200, type: 'ground' });

            if (Math.random() > 0.4 && cursorX > 400) {
                let stairX = cursorX + 50; let stairY = baseHeightY - 80;
                blocks.push({ x: stairX, y: stairY, width: 140, height: 30, type: 'stone' });
                coins.push({ x: stairX + 55, y: stairY - 50, width: 28, height: 28, collected: false, float: 0 });
            }
            cursorX += groundWidth;

            if (cursorX < finishLine.x - 300) {
                let gapWidth = 120 + Math.min(lvl * 2, 80);
                let hazardType = Math.random() > 0.5 ? 'lava' : 'water';
                hazards.push({ x: cursorX, y: canvas.height - 60, width: gapWidth, height: 60, type: hazardType });
                cursorX += gapWidth;
            }
        }

        for (let i = 500; i < finishLine.x; i += 350) {
            const blockTypes = ['wood', 'pipe', 'stone', 'metal'];
            let chosenType = blockTypes[Math.floor(Math.random() * blockTypes.length)];
            
            blocks.push({ x: i, y: canvas.height - 280 - Math.random() * 100, width: 140, height: 35, type: chosenType });
            coins.push({ x: i + 55, y: canvas.height - 380, width: 28, height: 28, collected: false, float: Math.random() * Math.PI });
            
            if (Math.random() > 0.2) {
                enemies.push({ x: i + 80, y: canvas.height - 170, width: 45, height: 45, vx: 2 + (lvl * 0.05), minX: i, maxX: i + 250, alive: true });
            }
        }

        for (let i = 0; i < 50; i++) clouds.push({ x: i * 350 + Math.random() * 150, y: 20 + Math.random() * 150, size: 50 + Math.random() * 50 });
        cameraX = 0;
    }

    function createParticles(x, y, color, count = 18) {
        for(let i = 0; i < count; i++) {
            particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 1) * 10, life: 1, color: color, size: Math.random() * 8 + 3 });
        }
    }
    
    function createFloatingText(x, y, text, color) {
        floatingTexts.push({ x: x, y: y, text: text, color: color, life: 1, vy: -2 });
    }

    let moveLeft = false, moveRight = false;
    function setupControls() {
        const bindBtn = (id, start, end) => {
            const el = document.getElementById(id);
            if(!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); start(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); end(); });
            el.addEventListener('mousedown', () => { initAudio(); start(); });
            el.addEventListener('mouseup', end);
        };
        bindBtn('btn-left', () => moveLeft = true, () => moveLeft = false);
        bindBtn('btn-right', () => moveRight = true, () => moveRight = false);
        
        const jumpBtn = document.getElementById('btn-jump');
        if(jumpBtn) {
            const triggerJump = (e) => {
                if(e) e.preventDefault();
                initAudio(); 
                if (player && player.grounded) { 
                    player.vy = player.jumpForce; player.grounded = false; 
                    player.scaleX = 0.7; player.scaleY = 1.3;
                    playSound('jump'); 
                    let pColor = player.isRainbow ? `hsl(${Date.now() % 360}, 100%, 50%)` : '#ffffff';
                    createParticles(player.x + player.width/2, player.y + player.height, pColor, 12); 
                }
            };
            jumpBtn.addEventListener('touchstart', triggerJump);
            jumpBtn.addEventListener('click', triggerJump);
        }
    }

    function update() {
        if (!gameActive) return;

        player.scaleX += (1 - player.scaleX) * 0.15;
        player.scaleY += (1 - player.scaleY) * 0.15;

        player.vx = 0;
        if (moveLeft) { player.vx = -player.speed; player.dir = -1; }
        if (moveRight) { player.vx = player.speed; player.dir = 1; }
        player.x += player.vx;
        player.vy += 0.7;
        player.y += player.vy;
        
        let wasGrounded = player.grounded;
        player.grounded = false;

        if (Math.abs(player.vx) > 0 || player.vy !== 0) {
            player.trail.push({ x: player.x, y: player.y, rainbowHue: Date.now() % 360 });
            if (player.trail.length > 10) player.trail.shift();
        } else if (player.trail.length > 0) player.trail.shift();

        particles.forEach(p => { p.vy += 0.3; p.x += p.vx; p.y += p.vy; p.life -= 0.03; p.size *= 0.95; });
        particles = particles.filter(p => p.life > 0);

        floatingTexts.forEach(ft => { ft.y += ft.vy; ft.life -= 0.02; });
        floatingTexts = floatingTexts.filter(ft => ft.life > 0);

        blocks.forEach(b => {
            if (player.x + player.width > b.x && player.x < b.x + b.width && player.y + player.height > b.y && player.y < b.y + b.height) {
                if (player.vy > 0 && player.y + player.height - player.vy <= b.y + 20) {
                    player.y = b.y - player.height; player.vy = 0; player.grounded = true;
                    if(!wasGrounded) { player.scaleX = 1.3; player.scaleY = 0.7; createParticles(player.x + 20, player.y + 40, '#ddd', 8); }
                } else if (player.vy < 0 && player.y - player.vy >= b.y + b.height - 15) {
                    player.y = b.y + b.height; player.vy = 0;
                }
            }
        });

        hazards.forEach(hz => {
            if (player.x + player.width > hz.x + 15 && player.x < hz.x + hz.width - 15 && player.y + player.height >= hz.y + 15) {
                playSound('hit'); lives--; document.getElementById('lives-val').innerText = lives;
                shakeTime = 30; player.x = Math.max(0, hz.x - 120); player.y = 50; player.vy = 0;
                createParticles(player.x, player.y, hz.type === 'lava' ? '#ff3d00' : '#03a9f4', 30);
                if (lives <= 0) { triggerGameOver(); }
            }
        });

        enemies.forEach(en => {
            if (!en.alive) return;
            en.x += en.vx; if (en.x < en.minX || en.x > en.maxX) en.vx *= -1;
            if (player.x + player.width > en.x && player.x < en.x + en.width && player.y + player.height > en.y && player.y < en.y + en.height) {
                if (player.vy > 0 && player.y + player.height - player.vy <= en.y + 20) {
                    en.alive = false; player.vy = -10; score += 50; document.getElementById('score-val').innerText = score;
                    playSound('jump'); createParticles(en.x + 20, en.y + 20, '#ff0000', 20);
                    createFloatingText(en.x, en.y, "+50", "#ff1744");
                } else {
                    playSound('hit'); lives--; document.getElementById('lives-val').innerText = lives;
                    shakeTime = 25; player.vy = -8; player.x += (player.x < en.x) ? -60 : 60; createParticles(player.x, player.y, player.color, 25);
                    if (lives <= 0) { triggerGameOver(); }
                }
            }
        });

        coins.forEach(c => {
            c.float += 0.08; c.y += Math.sin(c.float) * 0.8;
            if (!c.collected && player.x + player.width > c.x && player.x < c.x + c.width && player.y + player.height > c.y && player.y < c.y + c.height) {
                c.collected = true; score += 10; document.getElementById('score-val').innerText = score;
                playSound('coin'); createParticles(c.x + 14, c.y + 14, '#ffea00', 15);
                createFloatingText(c.x, c.y, "+10", "#ffcc00");
            }
        });

        if (player.y > canvas.height) {
            playSound('hit'); lives--; document.getElementById('lives-val').innerText = lives; shakeTime = 30;
            player.x = cameraX + 150; player.y = 50; player.vy = 0;
            if (lives <= 0) { triggerGameOver(); }
        }

        if (finishLine && player.x + player.width > finishLine.x && player.x < finishLine.x + finishLine.width) {
            playSound('coin'); createParticles(player.x, player.y, '#00e676', 40);
            createFloatingText(player.x, player.y - 40, "فوز!", "#00e676");
            winLevel();
        }

        cameraX += ((player.x - canvas.width / 2.5) - cameraX) * 0.08; 
        if (cameraX < 0) cameraX = 0;
        backgroundY = Math.sin(Date.now() * 0.0005) * 10;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        
        let shakeX = 0, shakeY = 0;
        if (shakeTime > 0) { shakeX = (Math.random() - 0.5) * 15; shakeY = (Math.random() - 0.5) * 15; shakeTime--; }
        ctx.translate(-cameraX + shakeX, shakeY);

        let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGradient.addColorStop(0, "#1976d2"); skyGradient.addColorStop(1, "#64b5f6");
        ctx.fillStyle = skyGradient;
        ctx.fillRect(cameraX, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#1565c0";
        for(let i = -1; i < 10; i++) {
            ctx.beginPath();
            let pX = (cameraX * 0.8) + (i * 400);
            ctx.moveTo(pX, canvas.height);
            ctx.lineTo(pX + 200, canvas.height - 300 + backgroundY);
            ctx.lineTo(pX + 400, canvas.height);
            ctx.fill();
        }

        ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
        clouds.forEach(cl => {
            let cx = cl.x + (cameraX * 0.5);
            ctx.beginPath(); ctx.arc(cx, cl.y, cl.size * 0.5, 0, Math.PI * 2);
            ctx.arc(cx + cl.size * 0.4, cl.y - cl.size * 0.2, cl.size * 0.4, 0, Math.PI * 2);
            ctx.arc(cx + cl.size * 0.8, cl.y, cl.size * 0.45, 0, Math.PI * 2); ctx.fill();
        });

        hazards.forEach(hz => {
            if (hz.type === 'lava') {
                ctx.shadowBlur = 20; ctx.shadowColor = "#ff3d00";
                ctx.fillStyle = "#ff3d00"; ctx.fillRect(hz.x, hz.y + 20, hz.width, hz.height - 20);
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#ffea00";
                for(let i=0; i<hz.width; i+=40) { ctx.fillRect(hz.x + i + (Date.now()/50 % 20), hz.y + 10, 20, 20); }
            } else {
                ctx.shadowBlur = 15; ctx.shadowColor = "#00bcd4";
                ctx.fillStyle = "#03a9f4"; ctx.fillRect(hz.x, hz.y + 15, hz.width, hz.height - 15);
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#e0f7fa"; ctx.fillRect(hz.x, hz.y + 10, hz.width, 10);
            }
        });

        if (finishLine) {
            ctx.fillStyle = "#fff"; ctx.fillRect(finishLine.x, finishLine.y, 12, finishLine.height);
            ctx.shadowBlur = 20; ctx.shadowColor = "#00e676";
            ctx.fillStyle = "#00e676"; ctx.fillRect(finishLine.x + 12, finishLine.y, finishLine.width, 45);
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#000"; ctx.font = "24px Changa"; ctx.fillText("النهاية", finishLine.x + 18, finishLine.y + 32);
        }

        blocks.forEach(b => {
            if (b.type === 'ground') {
                ctx.fillStyle = "#5D4037"; ctx.fillRect(b.x, b.y + 25, b.width, (canvas.height - b.y) - 25);
                ctx.fillStyle = "#43A047"; ctx.fillRect(b.x, b.y, b.width, 25);
                ctx.strokeStyle = "#1B5E20"; ctx.lineWidth = 4; ctx.strokeRect(b.x, b.y, b.width, 25);
            } else {
                let pColor = "#34495e", bColor = "#2c3e50";
                if (b.type === 'wood') { pColor = "#8d6e63"; bColor = "#4e342e"; } 
                else if (b.type === 'pipe') { pColor = "#4caf50"; bColor = "#1b5e20"; }
                else if (b.type === 'stone') { pColor = "#90a4ae"; bColor = "#455a64"; }
                
                ctx.fillStyle = pColor; ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.strokeStyle = bColor; ctx.lineWidth = 4; ctx.strokeRect(b.x, b.y, b.width, b.height);
            }
        });

        coins.forEach(c => {
            if (!c.collected) {
                ctx.shadowBlur = 10; ctx.shadowColor = "#ffcc00";
                ctx.fillStyle = "#ffcc00"; ctx.beginPath(); ctx.arc(c.x + c.width/2, c.y + c.height/2, c.width/2, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.stroke();
                ctx.shadowBlur = 0;
            }
        });

        enemies.forEach(en => {
            if (en.alive) {
                ctx.shadowBlur = 15; ctx.shadowColor = "#d50000";
                ctx.fillStyle = "#212121"; ctx.fillRect(en.x, en.y, en.width, en.height);
                ctx.fillStyle = "#ff1744"; ctx.fillRect(en.x + 8, en.y + 12, 12, 12); ctx.fillRect(en.x + 25, en.y + 12, 12, 12);
                ctx.shadowBlur = 0;
            }
        });

        if(player && player.trail) {
            player.trail.forEach((t, i) => {
                ctx.globalAlpha = (i / player.trail.length) * 0.6;
                ctx.fillStyle = player.isRainbow ? `hsl(${t.rainbowHue}, 100%, 50%)` : player.trailColors[i % 3];
                ctx.fillRect(t.x + 4, t.y + 4, player.width - 8, player.height - 8);
            });
            ctx.globalAlpha = 1.0;
        }

        if(player) {
            ctx.save();
            ctx.translate(player.x + player.width/2, player.y + player.height);
            ctx.scale(player.scaleX, player.scaleY);
            
            let activeColor = player.isRainbow ? `hsl(${Date.now() * 0.3 % 360}, 100%, 55%)` : player.color;

            if(player.crown) { 
                ctx.shadowBlur = player.isRainbow ? 35 : 20; 
                ctx.shadowColor = player.isRainbow ? `hsl(${Date.now() * 0.3 % 360}, 100%, 50%)` : "#ffea00"; 
            }
            
            ctx.fillStyle = "#000000"; ctx.fillRect(-player.width/2 - 4, -player.height - 4, player.width + 8, player.height + 8);
            ctx.fillStyle = activeColor; ctx.fillRect(-player.width/2, -player.height, player.width, player.height);
            ctx.shadowBlur = 0;

            ctx.fillStyle = player.eyesColor;
            let eyeOffset = player.dir === 1 ? 5 : -5;
            ctx.fillRect(-player.width/2 + 10 + eyeOffset, -player.height + 12, 10, 12);
            ctx.fillRect(-player.width/2 + 25 + eyeOffset, -player.height + 12, 10, 12);

            if(player.crown) {
                ctx.fillStyle = "#ffcc00";
                ctx.beginPath();
                ctx.moveTo(-player.width/2 + 5, -player.height - 2);
                ctx.lineTo(-player.width/2 + 10, -player.height - 18);
                ctx.lineTo(-player.width/2 + 22, -player.height - 8);
                ctx.lineTo(-player.width/2 + 35, -player.height - 18);
                ctx.lineTo(-player.width/2 + 40, -player.height - 2);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = "#000"; ctx.lineWidth = 3; ctx.stroke();
            }
            ctx.restore();
        }

        particles.forEach(p => {
            ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        floatingTexts.forEach(ft => {
            ctx.globalAlpha = ft.life; ctx.fillStyle = ft.color;
            ctx.font = "bold 24px Changa";
            ctx.shadowBlur = 4; ctx.shadowColor = "#000";
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.shadowBlur = 0;
        });
        ctx.globalAlpha = 1.0;

        ctx.restore();
    }

    function loop() { 
        if(!gameActive) { isLooping = false; return; }
        update(); draw(); 
        requestAnimationFrame(loop); 
    }
    
    setupControls();
    goHome();
</script>
</body>
</html>
