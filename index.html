<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mindrix</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #5c94fc;
            overflow: hidden;
            touch-action: none;
            font-family: 'Courier New', Courier, monospace;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background-color: #5c94fc;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            max-width: 100%;
            max-height: 100%;
        }

        /* شاشات القوائم (البداية والنهاية) */
        .game-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
            text-align: center;
        }

        .game-screen h1 {
            font-size: 36px;
            color: #f8b800;
            text-shadow: 3px 3px #c84c0c;
            margin-bottom: 10px;
        }

        .game-screen p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .menu-btn {
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            background-color: #e52521;
            color: white;
            border: 3px solid #fff;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }

        .menu-btn:active {
            transform: scale(0.95);
            background-color: #b01815;
        }

        /* لوحة النتيجة داخل اللعبة */
        #score-board {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
            display: none;
        }

        /* أزرار الجوال */
        #ui-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        .dir-buttons, .action-buttons {
            pointer-events: auto;
            display: flex;
            gap: 15px;
        }

        .control-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.25);
            border: 3px solid rgba(255, 255, 255, 0.8);
            color: #fff;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:active {
            background-color: rgba(255, 255, 255, 0.7);
            color: #000;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- شاشة البداية -->
    <div id="start-screen" class="game-screen">
        <h1>Super Mindrix</h1>
        <p>استعد للمغامرة واجمع العملات الذهبية!</p>
        <button class="menu-btn" onclick="startGame()">ابدأ اللعبة</button>
    </div>

    <!-- شاشة الخسارة -->
    <div id="gameover-screen" class="game-screen" style="display: none;">
        <h1>خسرت! 😢</h1>
        <p id="final-score">النتيجة: 0</p>
        <button class="menu-btn" onclick="startGame()">إعادة المحاولة</button>
    </div>

    <div id="score-board">النتيجة: <span id="score">0</span></div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-controls">
        <div class="dir-buttons">
            <button id="btn-left" class="control-btn">◀</button>
            <button id="btn-right" class="control-btn">▶</button>
        </div>
        <div class="action-buttons">
            <button id="btn-jump" class="control-btn">▲</button>
        </div>
    </div>
</div>

<script>
    // --- نظام المؤثرات الصوتية والموسيقى (Web Audio API) ---
    let audioCtx = null;
    let bgmTimer = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    // صوت القفز
    function playJumpSound() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.15);
        
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    }

    // صوت جمع العملة
    function playCoinSound() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, audioCtx.currentTime); // نغمة B5
        osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.08); // نغمة E6
        
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
    }

    // صوت القضاء على العدو
    function playStompSound() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.15);
        
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    }

    // صوت الخسارة
    function playGameOverSound() {
        if (!audioCtx) return;
        let notes = [300, 250, 200, 150];
        notes.forEach((freq, index) => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.12));
            
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime + (index * 0.12));
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + (index * 0.12) + 0.1);
            
            osc.start(audioCtx.currentTime + (index * 0.12));
            osc.stop(audioCtx.currentTime + (index * 0.12) + 0.1);
        });
    }

    // موسيقى خلفية كلاسيكية بسيطة ومتكررة
    function startBGM() {
        if (bgmTimer) clearInterval(bgmTimer);
        let melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
        let index = 0;
        bgmTimer = setInterval(() => {
            if (!audioCtx || gameState !== 'PLAYING') return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(melody[index], audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
            
            index = (index + 1) % melody.length;
        }, 300);
    }

    function stopBGM() {
        if (bgmTimer) {
            clearInterval(bgmTimer);
            bgmTimer = null;
        }
    }

    // --- إعدادات اللعبة الرسمية ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const scoreBoard = document.getElementById('score-board');
    const uiControls = document.getElementById('ui-controls');

    const GAME_WIDTH = 800;
    const GAME_HEIGHT = 400;

    function resize() {
        const scale = Math.min(window.innerWidth / GAME_WIDTH, window.innerHeight / GAME_HEIGHT);
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        canvas.style.width = `${GAME_WIDTH * scale}px`;
        canvas.style.height = `${GAME_HEIGHT * scale}px`;
    }
    window.addEventListener('resize', resize);
    resize();

    let gameState = 'START';
    let score = 0;
    let cameraX = 0;

    const player = {
        x: 50, y: 200, width: 28, height: 28,
        maxSpeed: 5, jumpPower: -11, gravity: 0.6, friction: 0.8,
        dy: 0, dx: 0, grounded: false
    };

    let platforms = [], enemies = [], coins = [], lava = [], goal = {};

    function initLevel() {
        score = 0;
        scoreElement.innerText = score;
        player.x = 50;
        player.y = 200;
        player.dx = 0;
        player.dy = 0;

        platforms = [
            { x: 0, y: 350, w: 400, h: 50, type: 'ground' },
            { x: 200, y: 250, w: 100, h: 20, type: 'block' },
            { x: 450, y: 350, w: 300, h: 50, type: 'ground' },
            { x: 550, y: 200, w: 150, h: 20, type: 'block' }, 
            { x: 650, y: 300, w: 40, h: 50, type: 'pipe' },
            { x: 900, y: 350, w: 150, h: 50, type: 'ground' },
            { x: 1200, y: 350, w: 400, h: 50, type: 'ground' },
            { x: 1250, y: 250, w: 50, h: 20, type: 'block' },
            { x: 1400, y: 150, w: 100, h: 20, type: 'block' }
        ];

        enemies = [
            { x: 300, y: 320, w: 26, h: 26, dx: -1, isDead: false },
            { x: 600, y: 170, w: 26, h: 26, dx: 1, isDead: false },
            { x: 950, y: 320, w: 26, h: 26, dx: -1.5, isDead: false },
            { x: 1300, y: 320, w: 26, h: 26, dx: 1, isDead: false }
        ];

        coins = [
            { x: 235, y: 210, w: 15, h: 15, collected: false },
            { x: 560, y: 160, w: 15, h: 15, collected: false },
            { x: 600, y: 160, w: 15, h: 15, collected: false },
            { x: 640, y: 160, w: 15, h: 15, collected: false },
            { x: 1265, y: 210, w: 15, h: 15, collected: false }
        ];

        lava = [
            { x: 1050, y: 370, w: 150, h: 30 }
        ];

        goal = { x: 1500, y: 200, w: 40, h: 150 };
    }

    function startGame() {
        initAudio();
        startScreen.style.display = 'none';
        gameoverScreen.style.display = 'none';
        scoreBoard.style.display = 'block';
        uiControls.style.display = 'flex';
        initLevel();
        gameState = 'PLAYING';
        startBGM();
    }

    function gameOver() {
        stopBGM();
        playGameOverSound();
        gameState = 'GAMEOVER';
        uiControls.style.display = 'none';
        scoreBoard.style.display = 'none';
        document.getElementById('final-score').innerText = `النتيجة النهائية: ${score}`;
        gameoverScreen.style.display = 'flex';
    }

    const keys = { right: false, left: false, up: false };

    window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if ((e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') && gameState === 'PLAYING') {
            if (!keys.up && player.grounded) playJumpSound();
            keys.up = true;
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
    });

    function setupTouchControls() {
        const bindTouch = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { 
                e.preventDefault(); 
                if (key === 'up' && player.grounded && gameState === 'PLAYING') {
                    playJumpSound();
                }
                keys[key] = true; 
            });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        };
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-jump', 'up');
    }
    setupTouchControls();

    function checkCollision(r1, r2) {
        return r1.x < r2.x + r2.w && r1.x + r1.width > r2.x &&
               r1.y < r2.y + r2.h && r1.y + r1.height > r2.y;
    }

    function update() {
        if (gameState === 'PLAYING') {
            if (keys.up && player.grounded) {
                player.dy = player.jumpPower;
                player.grounded = false;
            }
            
            if (keys.right) player.dx += 1;
            else if (keys.left) player.dx -= 1;
            
            player.dx *= player.friction;
            if (Math.abs(player.dx) > player.maxSpeed) player.dx = player.dx > 0 ? player.maxSpeed : -player.maxSpeed;
            
            player.dy += player.gravity;
            
            player.x += player.dx;
            player.grounded = false;
            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.dx > 0) player.x = p.x - player.width;
                    else if (player.dx < 0) player.x = p.x + p.w;
                    player.dx = 0;
                }
            }
            
            player.y += player.dy;
            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.dy > 0) {
                        player.y = p.y - player.height;
                        player.dy = 0;
                        player.grounded = true;
                    } else if (player.dy < 0) {
                        player.y = p.y + p.h;
                        player.dy = 0;
                    }
                }
            }
            
            if (player.x < 0) player.x = 0;

            enemies.forEach(enemy => {
                if (enemy.isDead) return;
                enemy.x += enemy.dx;
                for (let p of platforms) {
                    if (checkCollision(enemy, p)) {
                        if (p.type === 'pipe' || p.type === 'block') enemy.dx *= -1;
                    }
                }

                if (checkCollision(player, enemy)) {
                    if (player.dy > 0 && player.y + player.height - player.dy <= enemy.y + 10) {
                        enemy.isDead = true;
                        player.dy = -8;
                        playStompSound();
                        score += 100;
                        scoreElement.innerText = score;
                    } else {
                        gameOver();
                    }
                }
            });

            coins.forEach(coin => {
                if (!coin.collected && checkCollision(player, coin)) {
                    coin.collected = true;
                    playCoinSound();
                    score += 50;
                    scoreElement.innerText = score;
                }
            });

            lava.forEach(l => { if (checkCollision(player, l)) gameOver(); });
            if (player.y > GAME_HEIGHT) gameOver();

            if (checkCollision(player, goal)) {
                stopBGM();
                alert(`مبروك يا بطل! فزت باللعبة. نتيجتك: ${score}`);
                startGame();
            }

            cameraX = player.x - GAME_WIDTH / 2.5;
            if (cameraX < 0) cameraX = 0;
        }

        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        
        ctx.save();
        ctx.translate(-cameraX, 0); 
        
        platforms.forEach(p => {
            if(p.type === 'pipe') ctx.fillStyle = '#00a800'; 
            else if(p.type === 'block') ctx.fillStyle = '#f8b800'; 
            else ctx.fillStyle = '#c84c0c'; 
            
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x, p.y, p.w, p.h);
        });
        
        lava.forEach(l => {
            ctx.fillStyle = '#ff4000';
            ctx.fillRect(l.x, l.y, l.w, l.h);
        });

        coins.forEach(coin => {
            if (!coin.collected) {
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(coin.x + coin.w/2, coin.y + coin.h/2, coin.w/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
        });

        ctx.fillStyle = '#fff';
        ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
        ctx.fillStyle = '#000';
        ctx.fillText("النهاية", goal.x + 5, goal.y + 20);
        
        enemies.forEach(enemy => {
            if (!enemy.isDead) {
                ctx.fillStyle = '#802a2a';
                ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
                ctx.fillStyle = '#fff';
                ctx.fillRect(enemy.x + 4, enemy.y + 6, 6, 6);
                ctx.fillRect(enemy.x + 16, enemy.y + 6, 6, 6);
            }
        });

        ctx.fillStyle = '#f80000';
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillStyle = '#fff';
        let eyeX = keys.left ? player.x + 4 : player.x + 18;
        ctx.fillRect(eyeX, player.y + 6, 6, 6);
        
        ctx.restore();
    }

    update();
</script>
</body>
</html>
