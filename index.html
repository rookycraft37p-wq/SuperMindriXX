<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mindrix 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Arial', sans-serif; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(to bottom, #87CEEB, #E0F6FF); }
        
        #game-canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* واجهة النقاط والمستوى */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        .top-hud { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .score-box { background: rgba(0, 0, 0, 0.6); color: #ffca28; padding: 10px 20px; border-radius: 20px; font-size: 22px; font-weight: bold; }
        
        /* أزرار التحكم للموبايل والكمبيوتر */
        .controls-bar {
            position: absolute; bottom: 30px; width: 100%; left: 0; display: flex; justify-content: space-between; padding: 0 30px; z-index: 20; pointer-events: auto;
        }
        .control-btn {
            width: 75px; height: 75px; background: rgba(255, 255, 255, 0.8); border: none; border-radius: 50%;
            font-size: 30px; font-weight: bold; color: #333; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; active: transform: scale(0.9);
        }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7);
            z-index: 30; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; gap: 20px;
        }
        #start-screen h1 { font-size: 45px; color: #ffca28; text-shadow: 2px 2px #000; text-align: center; }
        .start-btn { background: #00e676; color: black; font-size: 22px; font-weight: bold; padding: 15px 45px; border-radius: 30px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>SUPER MINDRIX 3D</h1>
        <p>استخدم الأزرار يميناً ويساراً للتحرك والقفز!</p>
        <button class="start-btn" onclick="startGame()">▶ ابدأ اللعبة</button>
    </div>

    <div id="ui-layer">
        <div class="top-hud">
            <div class="score-box">⭐ النقاط: <span id="score-val">0</span></div>
            <div class="score-box">❤️ الحيوات: <span id="lives-val">3</span></div>
        </div>
    </div>

    <div class="controls-bar">
        <div style="display: flex; gap: 15px;">
            <button class="control-btn" id="btn-left">◀</button>
            <button class="control-btn" id="btn-right">▶</button>
        </div>
        <button class="control-btn" id="btn-jump">⤒</button>
    </div>

    <div id="game-canvas"></div>

<script>
    let scene, camera, renderer;
    let player, platforms = [], coins = [];
    let score = 0, lives = 3;
    let gameActive = false;

    // متغيرات الحركة والفيزياء للشخصية
    let playerVelocity = new THREE.Vector3(0, 0, 0);
    let isGrounded = false;
    let moveLeft = false, moveRight = false;

    function init() {
        // إعداد المشهد
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 60);

        // الكاميرا
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);
        camera.lookAt(0, 0, 0);

        // الرندر
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('game-canvas').appendChild(renderer.domElement);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // إنشاء الشخصية (Mindrix - تمثيلي لشخصية ماريو 3D مكعبة احترافية)
        createPlayer();

        // إنشاء المستويات والمنصات
        createLevel();

        // تفعيل الأزرار
        setupControls();

        // تشغيل حلقة التحديث
        animate();
    }

    function createPlayer() {
        const playerGroup = new THREE.Group();

        // الجسم (أحمر مثل ماريو)
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3b30 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 0.5), bodyMat);
        body.position.y = 0.5;
        body.castShadow = true;
        playerGroup.add(body);

        // الرأس
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), headMat);
        head.position.y = 1.35;
        head.castShadow = true;
        playerGroup.add(head);

        // قبعة
        const capMat = new THREE.MeshStandardMaterial({ color: 0xff3b30 });
        const cap = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.2, 0.8), capMat);
        cap.position.set(0, 1.75, 0.1);
        playerGroup.add(cap);

        player = playerGroup;
        player.position.set(0, 2, 0);
        scene.add(player);
    }

    function createLevel() {
        // الأرضية البداية
        createPlatform(0, -1, 0, 15, 1, 4, 0x4CAF50);

        // منصات متدرجة للقفز
        createPlatform(8, 1, 0, 5, 1, 3, 0x8B4513);
        createPlatform(15, 3, 0, 5, 1, 3, 0x8B4513);
        createPlatform(23, 1, 0, 6, 1, 3, 0x4CAF50);
        createPlatform(32, 4, 0, 5, 1, 3, 0x8B4513);

        // عملات ذهبية للجمع
        createCoin(8, 2.5, 0);
        createCoin(15, 4.5, 0);
        createCoin(23, 2.5, 0);
        createCoin(32, 5.5, 0);
    }

    function createPlatform(x, y, z, w, h, d, color) {
        const mat = new THREE.MeshStandardMaterial({ color: color });
        const geo = new THREE.BoxGeometry(w, h, d);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        mesh.receiveShadow = true;
        scene.add(mesh);
        platforms.push(mesh);
    }

    function createCoin(x, y, z) {
        const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
        const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = Math.PI / 2;
        mesh.position.set(x, y, z);
        scene.add(mesh);
        coins.push(mesh);
    }

    function setupControls() {
        const bindButton = (id, startAction, endAction) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); startAction(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); endAction(); });
            el.addEventListener('mousedown', () => startAction());
            el.addEventListener('mouseup', () => endAction());
        };

        bindButton('btn-left', () => moveLeft = true, () => moveLeft = false);
        bindButton('btn-right', () => moveRight = true, () => moveRight = false);
        
        document.getElementById('btn-jump').addEventListener('click', () => {
            if (isGrounded) {
                playerVelocity.y = 0.22; // قوة القفز
                isGrounded = false;
            }
        });

        // تحكم لوحة المفاتيح للكمبيوتر أيضاً
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
            if ((e.key === ' ' || e.key === 'ArrowUp') && isGrounded) {
                playerVelocity.y = 0.22;
                isGrounded = false;
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
        });
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        gameActive = true;
    }

    let animationTime = 0;

    function animate() {
        requestAnimationFrame(animate);

        if (gameActive) {
            // حركة الأفقية والأنيميشن التلقائي
            if (moveLeft) {
                player.position.x -= 0.12;
                player.rotation.y = Math.PI; // التوجه لليسار
                animationTime += 0.2;
                player.position.y += Math.sin(animationTime) * 0.03; // أنيميشن المشي
            } else if (moveRight) {
                player.position.x += 0.12;
                player.rotation.y = 0; // التوجه لليمين
                animationTime += 0.2;
                player.position.y += Math.sin(animationTime) * 0.03; // أنيميشن المشي
            }

            // الجاذبية والفيزياء
            playerVelocity.y -= 0.01; // الجاذبية
            player.position.y += playerVelocity.y;

            // فحص الاصطدام مع المنصات
            isGrounded = false;
            platforms.forEach(plat => {
                const box = new THREE.Box3().setFromObject(plat);
                const pBox = new THREE.Box3().setFromObject(player);

                // فحص الاصطدام من الأعلى
                if (player.position.x >= plat.position.x - 3 && player.position.x <= plat.position.x + 3 &&
                    player.position.y >= plat.position.y && player.position.y <= plat.position.y + 1.2 &&
                    playerVelocity.y <= 0) {
                    player.position.y = plat.position.y + 1;
                    playerVelocity.y = 0;
                    isGrounded = true;
                }
            });

            // فحص جمع العملات الذهبية
            coins.forEach((coin, index) => {
                coin.rotation.z += 0.05; // دوران العملة بشكل جمالي
                if (player.position.distanceTo(coin.position) < 1.2) {
                    scene.remove(coin);
                    coins.splice(index, 1);
                    score += 10;
                    document.getElementById('score-val').innerText = score;
                }
            });

            // السقوط في الحفرة (خسارة)
            if (player.position.y < -10) {
                lives--;
                document.getElementById('lives-val').innerText = lives;
                player.position.set(0, 3, 0);
                playerVelocity.set(0, 0, 0);
                if (lives <= 0) {
                    alert('انتهت اللعبة!');
                    location.reload();
                }
            }

            // الكاميرا تتبع اللاعب بسلاسة
            camera.position.x += (player.position.x - camera.position.x) * 0.1;
            camera.position.y += ((player.position.y + 3) - camera.position.y) * 0.1;
        }

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
</script>
</body>
</html>
