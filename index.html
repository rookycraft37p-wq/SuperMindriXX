<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SuperDrix Mario Edition</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Arial', sans-serif; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #5c94fc; }
        
        canvas { display: block; background: linear-space(#5c94fc, #87ceeb); }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        .top-hud { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .score-box { background: rgba(0, 0, 0, 0.75); color: #ffcc00; padding: 8px 18px; border-radius: 20px; font-size: 20px; font-weight: 900; border: 3px solid #fff; }
        
        .controls-bar {
            position: absolute; bottom: 25px; width: 100%; left: 0; display: flex; justify-content: space-between; padding: 0 25px; z-index: 20; pointer-events: auto;
        }
        .control-btn {
            width: 70px; height: 70px; background: rgba(255, 255, 255, 0.85); border: 4px solid #333; border-radius: 50%;
            font-size: 26px; font-weight: bold; color: #333; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 6px 0px rgba(0,0,0,0.4); cursor: pointer;
        }
        .control-btn:active { transform: translateY(4px); box-shadow: 0 2px 0px rgba(0,0,0,0.4); }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88);
            z-index: 30; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; gap: 20px; text-align: center;
        }
        #start-screen h1 { font-size: 40px; color: #ffcc00; text-shadow: 3px 3px #d32f2f; font-weight: 900; }
        .start-btn { background: #00e676; color: #000; font-size: 22px; font-weight: 900; padding: 12px 40px; border-radius: 30px; border: 4px solid #fff; cursor: pointer; box-shadow: 0 5px 0px #00793c; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>SUPERDRIX MARIO</h1>
        <p style="font-size: 16px; font-weight: bold;">اقفز فوق الوحوش، اجمع العملات، واقضِ على الأعداء!</p>
        <button class="start-btn" onclick="startGame()">▶ ابدأ مغامرة ماريو</button>
    </div>

    <div id="ui-layer">
        <div class="top-hud">
            <div class="score-box">🪙 <span id="score-val">0</span></div>
            <div class="score-box">❤️ <span id="lives-val">3</span></div>
        </div>
    </div>

    <div class="controls-bar">
        <div style="display: flex; gap: 12px;">
            <button class="control-btn" id="btn-left">◀</button>
            <button class="control-btn" id="btn-right">▶</button>
        </div>
        <button class="control-btn" id="btn-jump">⤒</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- المؤثرات الصوتية ---
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(350, now + 0.12);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
            osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'coin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.setValueAtTime(900, now + 0.08);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'stomp') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(250, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.15);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(40, now + 0.25);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
            osc.start(now); osc.stop(now + 0.25);
        }
    }

    // إعدادات اللعبة
    let gameActive = false;
    let score = 0;
    let lives = 3;
    let cameraX = 0;

    // اللاعب (المكعب الشرس مطابق للوجو تماماً)
    let player = {
        x: 100, y: 200, width: 45, height: 45,
        vx: 0, vy: 0, speed: 4.5, jumpForce: -11,
        grounded: false, dir: 1
    };

    // عناصر عالم ماريو (أرضيات، طابوق، أنابيب، عملات، أعداء)
    let blocks = [];
    let coins = [];
    let enemies = [];
    let pipes = [];
    let clouds = [];

    function initLevel() {
        blocks = [];
        coins = [];
        enemies = [];
        pipes = [];
        clouds = [];

        // إنشاء أرضية طويلة جداً تشبه ماريو
        for (let i = 0; i < 50; i++) {
            if (i !== 12 && i !== 13 && i !== 28 && i !== 29) { // فجوات للحماس
                blocks.push({ x: i * 50, y: canvas.height - 70, width: 50, height: 70, type: 'ground' });
            }
        }

        // منصات وطابوق عائم وصناديق عملات
        const platformConfigs = [
            { x: 300, y: canvas.height - 180, w: 150, h: 25 },
            { x: 550, y: canvas.height - 230, w: 200, h: 25 },
            { x: 850, y: canvas.height - 190, w: 150, h: 25 },
            { x: 1150, y: canvas.height - 220, w: 180, h: 25 },
            { x: 1500, y: canvas.height - 200, w: 200, h: 25 }
        ];

        platformConfigs.forEach(p => {
            blocks.push({ x: p.x, y: p.y, width: p.w, height: p.h, type: 'brick' });
        });

        // أنابيب ماريو الشهيرة
        pipes.push({ x: 700, y: canvas.height - 150, width: 50, height: 80 });
        pipes.push({ x: 1350, y: canvas.height - 170, width: 50, height: 100 });

        // عملات ذهبية لامعة موزعة في العالم
        for (let i = 250; i < 1800; i += 120) {
            coins.push({ x: i, y: canvas.height - 240 + Math.sin(i) * 40, width: 22, height: 22, collected: false });
        }

        // وحوش وأعداء تسير وتدور
        enemies.push({ x: 400, y: canvas.height - 120, width: 40, height: 40, vx: 1.5, minX: 300, maxX: 500, alive: true });
        enemies.push({ x: 900, y: canvas.height - 120, width: 40, height: 40, vx: -1.5, minX: 850, maxX: 1000, alive: true });
        enemies.push({ x: 1200, y: canvas.height - 120, width: 40, height: 40, vx: 2, minX: 1150, maxX: 1300, alive: true });

        // سحب في الخلفية
        for (let i = 0; i < 15; i++) {
            clouds.push({ x: i * 250 + Math.random() * 50, y: 50 + Math.random() * 100, size: 40 + Math.random() * 30 });
        }
    }

    let moveLeft = false, moveRight = false;

    function setupControls() {
        const bindButton = (id, start, end) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); start(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); end(); });
            el.addEventListener('mousedown', () => { initAudio(); start(); });
            el.addEventListener('mouseup', () => end());
        };

        bindButton('btn-left', () => moveLeft = true, () => moveLeft = false);
        bindButton('btn-right', () => moveRight = true, () => moveRight = false);
        
        document.getElementById('btn-jump').addEventListener('click', () => {
            initAudio();
            if (player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
                playSound('jump');
            }
        });

        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
            if ((e.key === ' ' || e.key === 'ArrowUp') && player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
                playSound('jump');
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
        });
    }

    function startGame() {
        initAudio();
        document.getElementById('start-screen').style.display = 'none';
        initLevel();
        gameActive = true;
        loop();
    }

    function update() {
        if (!gameActive) return;

        // الحركة الأفقية
        player.vx = 0;
        if (moveLeft) { player.vx = -player.speed; player.dir = -1; }
        if (moveRight) { player.vx = player.speed; player.dir = 1; }

        player.x += player.vx;

        // الجاذبية والسرعة الرأسية
        player.vy += 0.55; // جاذبية ماريو الكلاسيكية
        player.y += player.vy;

        player.grounded = false;

        // اصطدام اللاعب مع المنصات والطابوق
        blocks.forEach(b => {
            if (player.x + player.width > b.x && player.x < b.x + b.width &&
                player.y + player.height > b.y && player.y < b.y + b.height) {
                
                // اصطدام من الأعلى (الوقوف على المنصة)
                if (player.vy > 0 && player.y + player.height - player.vy <= b.y + 10) {
                    player.y = b.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
                // اصطدام من الأسفل
                else if (player.vy < 0 && player.y - player.vy >= b.y + b.height - 10) {
                    player.y = b.y + b.height;
                    player.vy = 0;
                }
            }
        });

        // اصطدام مع الأنابيب
        pipes.forEach(p => {
            if (player.x + player.width > p.x && player.x < p.x + p.width &&
                player.y + player.height > p.y && player.y < p.y + p.height) {
                if (player.vy > 0 && player.y + player.height - player.vy <= p.y + 10) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                } else if (player.vx > 0) {
                    player.x = p.x - player.width;
                } else if (player.vx < 0) {
                    player.x = p.x + p.width;
                }
            }
        });

        // حركة الأعداء والوحوش والتحقق من القفز فوقهم
        enemies.forEach(en => {
            if (!en.alive) return;

            en.x += en.vx;
            if (en.x < en.minX || en.x > en.maxX) en.vx *= -1;

            // فحص الاصطدام مع اللاعب
            if (player.x + player.width > en.x && player.x < en.x + en.width &&
                player.y + player.height > en.y && player.y < en.y + en.height) {
                
                // إذا سقط اللاعب فوق الوحش تماماً -> القضاء على الوحش مثل ماريو!
                if (player.vy > 0 && player.y + player.height - player.vy <= en.y + 15) {
                    en.alive = false;
                    player.vy = -8; // ارتداد للأعلى
                    score += 50;
                    document.getElementById('score-val').innerText = score;
                    playSound('stomp');
                } else {
                    // إذا لمسه من الجانب -> يفقد حياة
                    playSound('hit');
                    lives--;
                    document.getElementById('lives-val').innerText = lives;
                    player.x -= 60; // إرجاع للخلف
                    player.y -= 30;
                    if (lives <= 0) {
                        alert('انتهت اللعبة! حاول مرة أخرى.');
                        location.reload();
                    }
                }
            }
        });

        // جمع العملات
        coins.forEach(c => {
            if (!c.collected &&
                player.x + player.width > c.x && player.x < c.x + c.width &&
                player.y + player.height > c.y && player.y < c.y + c.height) {
                c.collected = true;
                score += 10;
                document.getElementById('score-val').innerText = score;
                playSound('coin');
            }
        });

        // السقوط في الفراغ
        if (player.y > canvas.height) {
            playSound('hit');
            lives--;
            document.getElementById('lives-val').innerText = lives;
            player.x = 100;
            player.y = 200;
            player.vy = 0;
            if (lives <= 0) {
                alert('انتهت اللعبة!');
                location.reload();
            }
        }

        // تحريك الكاميرا بسلاسة لتتبع اللاعب
        cameraX = player.x - canvas.width / 3;
        if (cameraX < 0) cameraX = 0;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-cameraX, 0);

        // رسم الخلفية والسحب
        ctx.fillStyle = "#ffffff";
        clouds.forEach(cl => {
            ctx.beginPath();
            ctx.arc(cl.x, cl.y, cl.size * 0.5, 0, Math.PI * 2);
            ctx.arc(cl.x + cl.size * 0.4, cl.y - cl.size * 0.2, cl.size * 0.4, 0, Math.PI * 2);
            ctx.arc(cl.x + cl.size * 0.8, cl.y, cl.size * 0.45, 0, Math.PI * 2);
            ctx.fill();
        });

        // رسم الأرضيات والطابوق (مطابق للوجو: عشب أخضر وتراب برتقالي)
        blocks.forEach(b => {
            if (b.type === 'ground') {
                ctx.fillStyle = "#d95700"; // تراب
                ctx.fillRect(b.x, b.y + 15, b.width, b.height - 15);
                ctx.fillStyle = "#38b764"; // عشب علوي
                ctx.fillRect(b.x, b.y, b.width, 18);
            } else {
                ctx.fillStyle = "#e67e22"; // طابوق المنصات
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.strokeStyle = "#b94a00";
                ctx.lineWidth = 2;
                ctx.strokeRect(b.x, b.y, b.width, b.height);
            }
        });

        // رسم أنابيب ماريو
        pipes.forEach(p => {
            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = "#27ae60";
            ctx.fillRect(p.x - 4, p.y, p.width + 8, 22); // حافة الأنبوب
            ctx.strokeStyle = "#145a32";
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x, p.y, p.width, p.height);
            ctx.strokeRect(p.x - 4, p.y, p.width + 8, 22);
        });

        // رسم العملات الذهبية اللامعة
        coins.forEach(c => {
            if (!c.collected) {
                ctx.fillStyle = "#ffcc00";
                ctx.beginPath();
                ctx.arc(c.x + c.width / 2, c.y + c.height / 2, c.width / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#b38600";
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        });

        // رسم الوحوش والأعداء
        enemies.forEach(en => {
            if (en.alive) {
                ctx.fillStyle = "#8e44ad"; // جسم الوحش البنفسجي
                ctx.fillRect(en.x, en.y, en.width, en.height);
                // عيون الوحش الشرسة
                ctx.fillStyle = "#f1c40f";
                ctx.fillRect(en.x + 6, en.y + 8, 10, 10);
                ctx.fillRect(en.x + 24, en.y + 8, 10, 10);
            }
        });

        // رسم اللاعب (المكعب الشرس المطابق تماماً للوجو بعينيه الحادتين)
        ctx.fillStyle = "#e52521"; // أحمر زاهٍ مطابِق للوجو
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.strokeStyle = "#781c1c";
        ctx.lineWidth = 2;
        ctx.strokeRect(player.x, player.y, player.width, player.height);

        // عيون المكعب (تتجه حسب حركة اللاعب يميناً أو يساراً لئلا تختفي أبداً)
        ctx.fillStyle = "#ffffff";
        let eyeOffset = player.dir === 1 ? 24 : 4;
        ctx.fillRect(player.x + eyeOffset, player.y + 10, 12, 14);
        ctx.fillRect(player.x + eyeOffset + 8, player.y + 10, 12, 14);
        
        ctx.fillStyle = "#000000";
        let pupilOffset = player.dir === 1 ? 30 : 10;
        ctx.fillRect(player.x + pupilOffset, player.y + 14, 5, 8);

        ctx.restore();
    }

    function loop() {
        update();
        draw();
        if (gameActive) requestAnimationFrame(loop);
    }

    setupControls();
</script>
</body>
</html>
