<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SuperDrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@700;800&display=swap');
        
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #2b8cbe; font-family: 'Changa', sans-serif; }
        
        canvas { display: block; background: linear-gradient(#2b8cbe, #74c2e1); }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        .top-hud { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .score-box { background: rgba(0, 0, 0, 0.8); color: #ffcc00; padding: 8px 20px; border-radius: 15px; font-size: 24px; font-weight: 800; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        /* إجبار الأزرار على البقاء من اليسار لليمين LTR لحل مشكلة الانعكاس */
        .controls-bar {
            position: absolute; bottom: 30px; width: 100%; left: 0; display: flex; justify-content: space-between; padding: 0 30px; z-index: 20; pointer-events: auto;
            direction: ltr; /* هذا السطر يحل المشكلة نهائياً */
        }
        .control-group { display: flex; gap: 15px; }
        .control-btn {
            width: 75px; height: 75px; background: rgba(255, 255, 255, 0.9); border: 4px solid #111; border-radius: 50%;
            font-size: 30px; font-weight: bold; color: #111; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 6px 0px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.05s;
        }
        .control-btn:active { transform: translateY(6px); box-shadow: 0 0px 0px rgba(0,0,0,0.5); background: #ddd; }
        #btn-jump { background: #ffcc00; color: #111; }
        #btn-jump:active { background: #e6b800; }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 20, 30, 0.9);
            z-index: 30; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; gap: 25px; text-align: center;
        }
        #start-screen h1 { font-size: 60px; color: #e52521; text-shadow: 4px 4px #000, -2px -2px #fff; font-weight: 900; letter-spacing: 2px; margin: 0; }
        .start-btn { background: #00e676; color: #000; font-size: 26px; font-weight: 800; padding: 15px 50px; border-radius: 40px; border: 5px solid #fff; cursor: pointer; box-shadow: 0 8px 0px #00793c; transition: all 0.2s; }
        .start-btn:active { transform: translateY(6px); box-shadow: 0 2px 0px #00793c; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>SUPERDRIX</h1>
        <p style="font-size: 20px; color: #ccc;">عالم مليء بالتحديات.. اجمع الذهب واقضِ على الأعداء!</p>
        <button class="start-btn" onclick="startGame()">ابدأ اللعب الآن</button>
    </div>

    <div id="ui-layer">
        <div class="top-hud">
            <div class="score-box">❤️ <span id="lives-val">3</span></div>
            <div class="score-box">🪙 <span id="score-val">0</span></div>
        </div>
    </div>

    <div class="controls-bar" id="controls">
        <div class="control-group">
            <button class="control-btn" id="btn-left">◀</button>
            <button class="control-btn" id="btn-right">▶</button>
        </div>
        <button class="control-btn" id="btn-jump">⤒</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.type = 'square'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'coin') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.setValueAtTime(1200, now + 0.05);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'hit') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
            gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        }
    }

    let gameActive = false, score = 0, lives = 3, cameraX = 0, shakeTime = 0;
    
    let player = {
        x: 100, y: 200, width: 45, height: 45,
        vx: 0, vy: 0, speed: 5.5, jumpForce: -13,
        grounded: false, dir: 1, trail: []
    };

    let blocks = [], coins = [], enemies = [], clouds = [], particles = [];

    function initLevel() {
        blocks = []; coins = []; enemies = []; clouds = []; particles = [];
        
        for (let i = 0; i < 60; i++) {
            if (i !== 10 && i !== 11 && i !== 25 && i !== 26) {
                blocks.push({ x: i * 55, y: canvas.height - 80, width: 55, height: 80, type: 'ground' });
            }
        }

        const platformConfigs = [
            { x: 300, y: canvas.height - 200, w: 150 }, { x: 600, y: canvas.height - 250, w: 200 },
            { x: 900, y: canvas.height - 200, w: 150 }, { x: 1200, y: canvas.height - 280, w: 200 }
        ];
        platformConfigs.forEach(p => blocks.push({ x: p.x, y: p.y, width: p.w, height: 35, type: 'brick' }));

        for (let i = 250; i < 2500; i += 150) {
            coins.push({ x: i, y: canvas.height - 280 + Math.sin(i) * 50, width: 26, height: 26, collected: false, float: Math.random() * Math.PI });
        }

        enemies.push({ x: 450, y: canvas.height - 130, width: 45, height: 45, vx: 2, minX: 300, maxX: 600, alive: true });
        enemies.push({ x: 1000, y: canvas.height - 130, width: 45, height: 45, vx: -2.5, minX: 800, maxX: 1100, alive: true });

        for (let i = 0; i < 20; i++) clouds.push({ x: i * 200 + Math.random() * 100, y: 30 + Math.random() * 100, size: 40 + Math.random() * 40 });
    }

    function createParticles(x, y, color) {
        for(let i = 0; i < 15; i++) {
            particles.push({
                x: x, y: y, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
                life: 1, color: color, size: Math.random() * 6 + 2
            });
        }
    }

    let moveLeft = false, moveRight = false;
    function setupControls() {
        const bindBtn = (id, start, end) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); start(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); end(); });
            el.addEventListener('mousedown', () => { initAudio(); start(); });
            el.addEventListener('mouseup', end);
        };
        bindBtn('btn-left', () => moveLeft = true, () => moveLeft = false);
        bindBtn('btn-right', () => moveRight = true, () => moveRight = false);
        document.getElementById('btn-jump').addEventListener('click', () => {
            initAudio(); if (player.grounded) { player.vy = player.jumpForce; player.grounded = false; playSound('jump'); createParticles(player.x + 20, player.y + 40, '#ffffff'); }
        });
    }

    function startGame() {
        initAudio(); document.getElementById('start-screen').style.display = 'none';
        initLevel(); gameActive = true; loop();
    }

    function update() {
        if (!gameActive) return;

        player.vx = 0;
        if (moveLeft) { player.vx = -player.speed; player.dir = -1; }
        if (moveRight) { player.vx = player.speed; player.dir = 1; }
        player.x += player.vx;
        player.vy += 0.6; // جاذبية
        player.y += player.vy;
        player.grounded = false;

        // ذيل السرعة (Trail)
        if (Math.abs(player.vx) > 0 || player.vy !== 0) {
            player.trail.push({ x: player.x, y: player.y });
            if (player.trail.length > 10) player.trail.shift();
        } else if (player.trail.length > 0) player.trail.shift();

        // تحديث الجزيئات
        particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.04; });
        particles = particles.filter(p => p.life > 0);

        blocks.forEach(b => {
            if (player.x + player.width > b.x && player.x < b.x + b.width && player.y + player.height > b.y && player.y < b.y + b.height) {
                if (player.vy > 0 && player.y + player.height - player.vy <= b.y + 12) {
                    player.y = b.y - player.height; player.vy = 0; player.grounded = true;
                } else if (player.vy < 0 && player.y - player.vy >= b.y + b.height - 12) {
                    player.y = b.y + b.height; player.vy = 0;
                }
            }
        });

        enemies.forEach(en => {
            if (!en.alive) return;
            en.x += en.vx; if (en.x < en.minX || en.x > en.maxX) en.vx *= -1;
            if (player.x + player.width > en.x && player.x < en.x + en.width && player.y + player.height > en.y && player.y < en.y + en.height) {
                if (player.vy > 0 && player.y + player.height - player.vy <= en.y + 15) {
                    en.alive = false; player.vy = -9; score += 50; document.getElementById('score-val').innerText = score;
                    playSound('jump'); createParticles(en.x + 20, en.y + 20, '#ff0000');
                } else {
                    playSound('hit'); lives--; document.getElementById('lives-val').innerText = lives;
                    shakeTime = 15; player.vy = -6; player.x += (player.x < en.x) ? -40 : 40; createParticles(player.x, player.y, '#e52521');
                    if (lives <= 0) { alert('لقد خسرت! حاول مجدداً.'); location.reload(); }
                }
            }
        });

        coins.forEach(c => {
            c.float += 0.1; c.y += Math.sin(c.float) * 0.5;
            if (!c.collected && player.x + player.width > c.x && player.x < c.x + c.width && player.y + player.height > c.y && player.y < c.y + c.height) {
                c.collected = true; score += 10; document.getElementById('score-val').innerText = score;
                playSound('coin'); createParticles(c.x + 13, c.y + 13, '#ffcc00');
            }
        });

        if (player.y > canvas.height) {
            playSound('hit'); lives--; document.getElementById('lives-val').innerText = lives; shakeTime = 20;
            player.x = 100; player.y = 100; player.vy = 0;
            if (lives <= 0) { alert('نهاية اللعبة!'); location.reload(); }
        }

        cameraX += ((player.x - canvas.width / 3) - cameraX) * 0.1; // كاميرا ناعمة
        if (cameraX < 0) cameraX = 0;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        
        let shakeX = 0, shakeY = 0;
        if (shakeTime > 0) { shakeX = (Math.random() - 0.5) * 12; shakeY = (Math.random() - 0.5) * 12; shakeTime--; }
        ctx.translate(-cameraX + shakeX, shakeY);

        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        clouds.forEach(cl => {
            ctx.beginPath(); ctx.arc(cl.x, cl.y, cl.size * 0.5, 0, Math.PI * 2);
            ctx.arc(cl.x + cl.size * 0.4, cl.y - cl.size * 0.2, cl.size * 0.4, 0, Math.PI * 2);
            ctx.arc(cl.x + cl.size * 0.8, cl.y, cl.size * 0.45, 0, Math.PI * 2); ctx.fill();
        });

        blocks.forEach(b => {
            if (b.type === 'ground') {
                ctx.fillStyle = "#d95700"; ctx.fillRect(b.x, b.y + 15, b.width, b.height - 15);
                ctx.fillStyle = "#38b764"; ctx.fillRect(b.x, b.y, b.width, 18);
                ctx.strokeStyle = "#1b5e20"; ctx.lineWidth = 3; ctx.strokeRect(b.x, b.y, b.width, 18);
            } else {
                ctx.fillStyle = "#e67e22"; ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.strokeStyle = "#873600"; ctx.lineWidth = 3; ctx.strokeRect(b.x, b.y, b.width, b.height);
            }
        });

        coins.forEach(c => {
            if (!c.collected) {
                ctx.fillStyle = "#ffcc00"; ctx.beginPath(); ctx.arc(c.x + c.width/2, c.y + c.height/2, c.width/2, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
            }
        });

        enemies.forEach(en => {
            if (en.alive) {
                ctx.fillStyle = "#7b1fa2"; ctx.fillRect(en.x, en.y, en.width, en.height);
                ctx.fillStyle = "#ffeb3b"; ctx.fillRect(en.x + 8, en.y + 10, 10, 10); ctx.fillRect(en.x + 28, en.y + 10, 10, 10);
            }
        });

        // رسم ذيل الأفاتار (Trail)
        const trailColors = ["#ffffff", "#ff9999", "#99ccff"];
        player.trail.forEach((t, i) => {
            ctx.globalAlpha = (i / player.trail.length) * 0.6;
            ctx.fillStyle = trailColors[i % 3];
            ctx.fillRect(t.x + 2, t.y + 2, player.width - 4, player.height - 4);
        });
        ctx.globalAlpha = 1.0;

        // رسم الأفاتار المطابق تماماً للوجو
        ctx.fillStyle = "#000000"; ctx.fillRect(player.x - 3, player.y - 3, player.width + 6, player.height + 6); // إطار أسود
        ctx.fillStyle = "#e52521"; ctx.fillRect(player.x, player.y, player.width, player.height); // جسم أحمر

        ctx.fillStyle = "#ffffff";
        let eyeOffset = player.dir === 1 ? 4 : -4;
        
        // العين اليسرى الغاضبة
        ctx.beginPath(); ctx.moveTo(player.x + 6 + eyeOffset, player.y + 10); ctx.lineTo(player.x + 18 + eyeOffset, player.y + 15);
        ctx.lineTo(player.x + 18 + eyeOffset, player.y + 26); ctx.lineTo(player.x + 6 + eyeOffset, player.y + 24); ctx.fill();
        
        // العين اليمنى الغاضبة
        ctx.beginPath(); ctx.moveTo(player.x + 39 + eyeOffset, player.y + 10); ctx.lineTo(player.x + 27 + eyeOffset, player.y + 15);
        ctx.lineTo(player.x + 27 + eyeOffset, player.y + 26); ctx.lineTo(player.x + 39 + eyeOffset, player.y + 24); ctx.fill();

        // البؤبؤ الأسود
        ctx.fillStyle = "#000000";
        let pupilOffset = player.dir === 1 ? 2 : -4;
        ctx.fillRect(player.x + 12 + eyeOffset + pupilOffset, player.y + 18, 5, 6);
        ctx.fillRect(player.x + 28 + eyeOffset + pupilOffset, player.y + 18, 5, 6);

        // الجزيئات المتطايرة
        particles.forEach(p => {
            ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        ctx.restore();
    }

    function loop() { update(); draw(); if (gameActive) requestAnimationFrame(loop); }
    setupControls();
</script>
</body>
</html>
