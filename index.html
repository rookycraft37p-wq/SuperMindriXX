<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SuperDrix 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Arial', sans-serif; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #5c94fc; }
        
        #game-canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        .top-hud { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .score-box { background: rgba(0, 0, 0, 0.7); color: #ffcc00; padding: 10px 22px; border-radius: 25px; font-size: 24px; font-weight: 900; border: 3px solid #fff; }
        
        .controls-bar {
            position: absolute; bottom: 30px; width: 100%; left: 0; display: flex; justify-content: space-between; padding: 0 40px; z-index: 20; pointer-events: auto;
        }
        .control-btn {
            width: 80px; height: 80px; background: rgba(255, 255, 255, 0.9); border: 4px solid #333; border-radius: 50%;
            font-size: 32px; font-weight: bold; color: #333; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 6px 0px rgba(0,0,0,0.4); cursor: pointer;
        }
        .control-btn:active { transform: translateY(4px); box-shadow: 0 2px 0px rgba(0,0,0,0.4); }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            z-index: 30; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; gap: 20px; text-align: center;
        }
        #start-screen h1 { font-size: 50px; color: #ffcc00; text-shadow: 4px 4px #d32f2f; font-weight: 900; }
        .start-btn { background: #00e676; color: #000; font-size: 24px; font-weight: 900; padding: 15px 50px; border-radius: 35px; border: 4px solid #fff; cursor: pointer; box-shadow: 0 6px 0px #00793c; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>SUPERDRIX 3D</h1>
        <p style="font-size: 18px; font-weight: bold;">انطلق بالمكعب الشرس واجمع العملات الذهبية!</p>
        <button class="start-btn" onclick="startGame()">▶ ابدأ اللعبة</button>
    </div>

    <div id="ui-layer">
        <div class="top-hud">
            <div class="score-box">🪙 <span id="score-val">0</span></div>
            <div class="score-box">❤️ <span id="lives-val">3</span></div>
        </div>
    </div>

    <div class="controls-bar">
        <div style="display: flex; gap: 20px;">
            <button class="control-btn" id="btn-left">◀</button>
            <button class="control-btn" id="btn-right">▶</button>
        </div>
        <button class="control-btn" id="btn-jump">⤒</button>
    </div>

    <div id="game-canvas"></div>

<script>
    // --- المؤثرات الصوتية (Web Audio API) ---
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampYToValueAtTime ? osc.frequency.exponentialRampToValueAtTime(400, now + 0.15) : osc.frequency.linearRampToValueAtTime(400, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'coin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.setValueAtTime(900, now + 0.08);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
            osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'fall') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.4);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        }
    }

    // --- إعداد المشهد الثلاثي الأبعاد ---
    let scene, camera, renderer;
    let player, platforms = [], coins = [];
    let score = 0, lives = 3;
    let gameActive = false;

    let playerVelocity = new THREE.Vector3(0, 0, 0);
    let isGrounded = false;
    let moveLeft = false, moveRight = false;

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x5c94fc); // لون السماء الأزرق المطابق للصورة
        scene.fog = new THREE.Fog(0x5c94fc, 30, 80);

        // الكاميرا بعيدة وواسعة لترى كامل العالم بوضوح تام
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 7, 22);
        camera.lookAt(0, 1, 0);

        renderer = new THREE.WebGLRenderer({ antialias: false }); // بدون تلميع ليعطي طابع Pixel Art حاد
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('game-canvas').appendChild(renderer.domElement);

        // إضاءة واضحة ومشرقة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 25, 15);
        scene.add(dirLight);

        createPlayer();
        createLevel();
        setupControls();
        animate();
    }

    // تصميم الشخصية مطابقة تماماً للمكعب الأحمر الشرس في الصورة
    function createPlayer() {
        const playerGroup = new THREE.Group();

        // المكعب الأحمر الأساسي
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe52521, roughness: 0.3 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), bodyMat);
        body.position.y = 0.6;
        playerGroup.add(body);

        // عيون شرسة وغاضبة مطابقة للصورة
        const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const eyePupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

        // العين اليمنى
        const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.25, 0.1), eyeWhiteMat);
        eyeR.position.set(0.25, 0.75, 0.62);
        playerGroup.add(eyeR);
        const pupilR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.1), eyePupilMat);
        pupilR.position.set(0.32, 0.75, 0.65);
        playerGroup.add(pupilR);

        // العين اليسرى
        const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.25, 0.1), eyeWhiteMat);
        eyeL.position.set(-0.25, 0.75, 0.62);
        playerGroup.add(eyeL);
        const pupilL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.1), eyePupilMat);
        pupilL.position.set(-0.18, 0.75, 0.65);
        playerGroup.add(pupilL);

        player = playerGroup;
        player.position.set(0, 3, 0);
        scene.add(player);
    }

    // إنشاء المنصات الترابية بحدود خضراء مطابقة للصورة
    function createLevel() {
        for (let i = -2; i < 15; i++) {
            let xPos = i * 4;
            let yPos = (i > 5 && i < 8) ? 2 : (i >= 8 ? 1 : 0);
            
            // قاعدة ترابية برتقالية
            let groundMat = new THREE.MeshStandardMaterial({ color: 0xd95700, roughness: 0.9 });
            let groundGeo = new THREE.BoxGeometry(3.8, 1.8, 3.8);
            let groundMesh = new THREE.Mesh(groundGeo, groundMat);
            groundMesh.position.set(xPos, yPos - 0.9, 0);
            scene.add(groundMesh);
            platforms.push(groundMesh);

            // طبقة عشب خضراء في الأعلى
            let grassMat = new THREE.MeshStandardMaterial({ color: 0x38b764, roughness: 0.8 });
            let grassGeo = new THREE.BoxGeometry(3.8, 0.3, 3.8);
            let grassMesh = new THREE.Mesh(grassGeo, grassMat);
            grassMesh.position.set(xPos, yPos + 0.15, 0);
            scene.add(grassMesh);
            platforms.push(grassMesh);

            // إضافة عملات ذهبية فوق المنصات
            if (i > 1 && i % 2 === 0) {
                createCoin(xPos, yPos + 2.2, 0);
            }
        }
    }

    // إنشاء عملة ذهبية لامعة مشابهة للصورة
    function createCoin(x, y, z) {
        const mat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.6, roughness: 0.2, emissive: 0x554400 });
        const geo = new THREE.CylinderGeometry(0.7, 0.7, 0.15, 20);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = Math.PI / 2;
        mesh.position.set(x, y, z);
        scene.add(mesh);
        coins.push(mesh);
    }

    function setupControls() {
        const bindButton = (id, startAction, endAction) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); startAction(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); endAction(); });
            el.addEventListener('mousedown', () => { initAudio(); startAction(); });
            el.addEventListener('mouseup', () => endAction());
        };

        bindButton('btn-left', () => moveLeft = true, () => moveLeft = false);
        bindButton('btn-right', () => moveRight = true, () => moveRight = false);
        
        document.getElementById('btn-jump').addEventListener('click', () => {
            initAudio();
            if (isGrounded) {
                playerVelocity.y = 0.24;
                isGrounded = false;
                playSound('jump');
            }
        });

        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
            if ((e.key === ' ' || e.key === 'ArrowUp') && isGrounded) {
                playerVelocity.y = 0.24;
                isGrounded = false;
                playSound('jump');
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
        });
    }

    function startGame() {
        initAudio();
        document.getElementById('start-screen').style.display = 'none';
        gameActive = true;
    }

    let animTimer = 0;

    function animate() {
        requestAnimationFrame(animate);

        if (gameActive) {
            if (moveLeft) {
                player.position.x -= 0.14;
                player.rotation.y = Math.PI;
                animTimer += 0.25;
                player.position.y += Math.sin(animTimer) * 0.04;
            } else if (moveRight) {
                player.position.x += 0.14;
                player.rotation.y = 0;
                animTimer += 0.25;
                player.position.y += Math.sin(animTimer) * 0.04;
            }

            // الجاذبية
            playerVelocity.y -= 0.012;
            player.position.y += playerVelocity.y;

            // اصطدام المنصات
            isGrounded = false;
            platforms.forEach(plat => {
                if (player.position.x >= plat.position.x - 2 && player.position.x <= plat.position.x + 2 &&
                    player.position.y >= plat.position.y - 0.5 && player.position.y <= plat.position.y + 1.5 &&
                    playerVelocity.y <= 0) {
                    player.position.y = plat.position.y + 1.1;
                    playerVelocity.y = 0;
                    isGrounded = true;
                }
            });

            // جمع العملات
            coins.forEach((coin, index) => {
                coin.rotation.z += 0.06;
                if (player.position.distanceTo(coin.position) < 1.4) {
                    scene.remove(coin);
                    coins.splice(index, 1);
                    score += 10;
                    document.getElementById('score-val').innerText = score;
                    playSound('coin');
                }
            });

            // السقوط والخسارة
            if (player.position.y < -10) {
                playSound('fall');
                lives--;
                document.getElementById('lives-val').innerText = lives;
                player.position.set(0, 5, 0);
                playerVelocity.set(0, 0, 0);
                if (lives <= 0) {
                    alert('انتهت اللعبة! حاول مجدداً.');
                    location.reload();
                }
            }

            // الكاميرا البعيدة والواسعة تتبع اللاعب بنعومة
            camera.position.x += (player.position.x - camera.position.x) * 0.08;
            camera.position.y += ((player.position.y + 5) - camera.position.y) * 0.08;
        }

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
</script>
</body>
</html>
